// ─── Wholesale Page ───────────────────────────────────────────────────────────
function Wholesale({data,update,calcs}){
  const STEPS=['Produits','Client','Facture','Documents'];
  const[step,setStep]=useState(0);
  const[orderItems,setOrderItems]=useState([]);
  const[client,setClient]=useState({name:'',company:'',phone:'',email:'',address:'',city:'',ice:'',notes:''});
  const[discount,setDiscount]=useState(0);
  const[payMethod,setPayMethod]=useState('Virement bancaire');
  const[notes,setNotes]=useState('');
  const[shipPhoto,setShipPhoto]=useState(null);
  const[receiptPhoto,setReceiptPhoto]=useState(null);
  const[invoiceNo]=useState('FAC-GROS-'+String(Date.now()).slice(-6));
  const[savedOrderId,setSavedOrderId]=useState(null);
  const[viewOrder,setViewOrder]=useState(null);
  const[showInvoice,setShowInvoice]=useState(false);
  const shipRef=useRef();
  const recRef=useRef();
  const ci=data.companyInfo||{};

  const addItem=(prod)=>{
    const ex=orderItems.find(i=>i.productId===prod.id);
    if(ex){
      setOrderItems(orderItems.map(i=>i.productId===prod.id?{...i,qty:i.qty+1}:i));
    } else {
      setOrderItems([...orderItems,{productId:prod.id,name:prod.name,qty:1,unitPrice:prod.sellingPrice,category:prod.category}]);
    }
  };
  const removeItem=(pid)=>setOrderItems(orderItems.filter(i=>i.productId!==pid));
  const updateQty=(pid,qty)=>{
    if(qty<=0){removeItem(pid);return;}
    setOrderItems(orderItems.map(i=>i.productId===pid?{...i,qty:Number(qty)}:i));
  };
  const updatePrice=(pid,price)=>setOrderItems(orderItems.map(i=>i.productId===pid?{...i,unitPrice:Number(price)}:i));

  const subtotal=orderItems.reduce((s,i)=>s+i.qty*i.unitPrice,0);
  const discountAmt=subtotal*(discount/100);
  const total=subtotal-discountAmt;
  const tva=total*0.20;
  const totalTTC=total+tva;

  const handlePhoto=(file,setter)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>setter(e.target.result);
    reader.readAsDataURL(file);
  };

  const saveOrder=()=>{
    if(savedOrderId)return savedOrderId;
    const id='WHL-'+uid();
    const order={
      id,invoiceNo,date:today(),
      client:{...client},
      items:orderItems.map(i=>({...i})),
      subtotal,discount,discountAmt,total,tva,totalTTC,
      payMethod,notes,
      shipPhoto:shipPhoto||null,
      receiptPhoto:receiptPhoto||null,
      createdAt:today(),
    };
    update(d=>({
      ...d,
      wholesaleOrders:[...(d.wholesaleOrders||[]),order],
      sales:[...d.sales,...orderItems.map(i=>({
        id:'VNT'+uid(),date:today(),productId:i.productId,
        qty:i.qty,sellingPrice:i.unitPrice,createdAt:today(),source:'wholesale'
      }))],
    }));
    setSavedOrderId(id);
    return id;
  };

  const reset=()=>{
    setStep(0);setOrderItems([]);
    setClient({name:'',company:'',phone:'',email:'',address:'',city:'',ice:'',notes:''});
    setDiscount(0);setPayMethod('Virement bancaire');setNotes('');
    setShipPhoto(null);setReceiptPhoto(null);setSavedOrderId(null);
  };

  // ── Existing orders list ──────────────────────────────────────────────────
  if(viewOrder){
    const o=viewOrder;
    return(
      <div>
        <div className="section-header no-print">
          <button className="btn btn-ghost" onClick={()=>setViewOrder(null)}>\u2190 Retour</button>
          <button className="btn btn-primary" onClick={()=>window.print()}><Icon name="printer" size={14}/>Imprimer facture</button>
        </div>
        <InvoiceView order={o} ci={ci}/>
      </div>
    );
  }

  // ── New order wizard ──────────────────────────────────────────────────────
  const canNext=(
    step===0?orderItems.length>0:
    step===1?client.name.trim()!=='':
    step===2?true:true
  );

  return(
    <div>
      {/* Header with existing orders */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          {STEPS.map((s,i)=>(
            <React.Fragment key={i}>
              <div className={`ws-step${step===i?' active':i<step?' done':''}`} onClick={()=>i<step&&setStep(i)}>
                <span className="ws-step-num">{i<step?'\u2713':i+1}</span>
                {s}
              </div>
              {i<STEPS.length-1&&<span style={{color:'#CBD5E1',fontSize:16}}>›</span>}
            </React.Fragment>
          ))}
        </div>
        <div style={{display:'flex',gap:8}}>
          {(data.wholesaleOrders||[]).length>0&&(
            <span style={{fontSize:12,color:'#64748B',alignSelf:'center'}}>
              {(data.wholesaleOrders||[]).length} commande(s) enregistr\u00e9e(s)
            </span>
          )}
        </div>
      </div>

      {/* ── STEP 0: Product selection ── */}
      {step===0&&(
        <div>
          <div className="two-col" style={{gap:20}}>
            <div>
              <div className="card" style={{marginBottom:12}}>
                <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:600,marginBottom:12,color:'#0F172A'}}>
                  S\u00e9lectionner les produits
                </div>
                <div className="prod-pick">
                  {data.products.map(p=>{
                    const stock=calcs.stockMap[p.id]||0;
                    const sel=orderItems.find(i=>i.productId===p.id);
                    return(
                      <div key={p.id} className={`prod-card${sel?' selected':''}`} onClick={()=>stock>0&&addItem(p)}
                        style={{opacity:stock<=0?0.45:1,cursor:stock<=0?'not-allowed':'pointer'}}>
                        <div style={{fontSize:12,fontWeight:600,marginBottom:4,color:'#0F172A',lineHeight:1.3}}>{p.name}</div>
                        <div style={{fontSize:11,color:'#64748B',marginBottom:6}}>{p.category}</div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <span style={{fontSize:13,fontWeight:700,color:'#0D9488'}}>{fmtMAD(p.sellingPrice)}</span>
                          <span style={{fontSize:10,color:stock>10?'#15803D':stock>0?'#854D0E':'#B91C1C',fontWeight:600}}>
                            {stock<=0?'Rupture':'Stock: '+stock}
                          </span>
                        </div>
                        {sel&&<div style={{position:'absolute',bottom:8,right:8,background:'#0D9488',color:'#fff',borderRadius:4,padding:'1px 6px',fontSize:11,fontWeight:700}}>\xd7{sel.qty}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
            <div>
              <div className="card">
                <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:600,marginBottom:12}}>
                  Panier ({orderItems.length} article{orderItems.length!==1?'s':''})
                </div>
                {orderItems.length===0
                  ?<div style={{textAlign:'center',padding:'20px 0',color:'#94A3B8',fontSize:13}}>
                    Cliquez sur un produit pour l\u0027ajouter
                  </div>
                  :orderItems.map(item=>(
                    <div key={item.productId} style={{display:'flex',gap:8,alignItems:'center',padding:'8px 0',borderBottom:'1px solid #F1F5F9'}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                      </div>
                      <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
                        <button onClick={()=>updateQty(item.productId,item.qty-1)} style={{width:24,height:24,borderRadius:4,border:'1px solid #E2E8F0',background:'#F8FAFC',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:'#475569'}}>-</button>
                        <span style={{width:28,textAlign:'center',fontSize:13,fontWeight:600}}>{item.qty}</span>
                        <button onClick={()=>updateQty(item.productId,item.qty+1)} style={{width:24,height:24,borderRadius:4,border:'1px solid #E2E8F0',background:'#F8FAFC',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:'#475569'}}>+</button>
                      </div>
                      <div style={{width:90,flexShrink:0}}>
                        <input type="number" value={item.unitPrice}
                          onChange={e=>updatePrice(item.productId,e.target.value)}
                          style={{width:'100%',padding:'4px 6px',border:'1px solid #E2E8F0',borderRadius:5,fontSize:12,textAlign:'right'}}/>
                      </div>
                      <div style={{width:80,textAlign:'right',fontSize:12,fontWeight:600,color:'#0D9488',flexShrink:0}}>
                        {fmtMAD(item.qty*item.unitPrice)}
                      </div>
                      <button onClick={()=>removeItem(item.productId)} style={{background:'none',border:'none',cursor:'pointer',color:'#EF4444',padding:2,flexShrink:0}}>
                        <Icon name="x" size={14}/>
                      </button>
                    </div>
                  ))
                }
                {orderItems.length>0&&(
                  <div style={{marginTop:12,paddingTop:10,borderTop:'1px solid #E2E8F0'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                      <label style={{fontSize:12,color:'#64748B',whiteSpace:'nowrap'}}>Remise %</label>
                      <input type="number" min="0" max="100" value={discount}
                        onChange={e=>setDiscount(Math.min(100,Math.max(0,Number(e.target.value))))}
                        style={{width:70,padding:'4px 8px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:13,textAlign:'center'}}/>
                    </div>
                    <div style={{fontSize:12,color:'#64748B',marginBottom:4}}>Sous-total: <strong>{fmtMAD(subtotal)}</strong></div>
                    {discount>0&&<div style={{fontSize:12,color:'#EF4444',marginBottom:4}}>Remise ({discount}%): -{fmtMAD(discountAmt)}</div>}
                    <div style={{fontSize:12,color:'#64748B',marginBottom:4}}>HT: <strong>{fmtMAD(total)}</strong></div>
                    <div style={{fontSize:12,color:'#64748B',marginBottom:4}}>TVA 20%: <strong>{fmtMAD(tva)}</strong></div>
                    <div style={{fontSize:15,fontWeight:700,color:'#0D9488',marginTop:4}}>Total TTC: {fmtMAD(totalTTC)}</div>
                  </div>
                )}
              </div>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}>
            <button className="btn btn-primary" disabled={!canNext} onClick={()=>setStep(1)} style={{opacity:canNext?1:0.5}}>
              Suivant \u2192 Informations client
            </button>
          </div>
        </div>
      )}

      {/* ── STEP 1: Client info ── */}
      {step===1&&(
        <div>
          <div className="two-col">
            <div className="card">
              <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:600,marginBottom:14}}>Informations client</div>
              <div className="two-col">
                <div className="form-group"><label className="label">Nom / Pr\u00e9nom *</label><input className="input" value={client.name} onChange={e=>setClient({...client,name:e.target.value})} placeholder="Mohamed Alami"/></div>
                <div className="form-group"><label className="label">Soci\u00e9t\u00e9</label><input className="input" value={client.company} onChange={e=>setClient({...client,company:e.target.value})} placeholder="SARL XYZ"/></div>
              </div>
              <div className="two-col">
                <div className="form-group"><label className="label">T\u00e9l\u00e9phone</label><input className="input" value={client.phone} onChange={e=>setClient({...client,phone:e.target.value})} placeholder="+212 6xx xxx xxx"/></div>
                <div className="form-group"><label className="label">Email</label><input className="input" type="email" value={client.email} onChange={e=>setClient({...client,email:e.target.value})} placeholder="client@email.com"/></div>
              </div>
              <div className="form-group"><label className="label">Adresse</label><input className="input" value={client.address} onChange={e=>setClient({...client,address:e.target.value})} placeholder="N\u00b0 Rue, Quartier"/></div>
              <div className="two-col">
                <div className="form-group"><label className="label">Ville</label><input className="input" value={client.city} onChange={e=>setClient({...client,city:e.target.value})} placeholder="Casablanca"/></div>
                <div className="form-group"><label className="label">ICE (optionnel)</label><input className="input" value={client.ice} onChange={e=>setClient({...client,ice:e.target.value})} placeholder="001234567000088"/></div>
              </div>
              <div className="form-group"><label className="label">Notes commande</label><input className="input" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Instructions sp\u00e9ciales, d\u00e9lais..."/></div>
            </div>
            <div className="card">
              <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:600,marginBottom:14}}>Mode de paiement</div>
              {['Virement bancaire','Esp\u00e8ces','Ch\u00e8que','PayPal','Western Union'].map(m=>(
                <div key={m} onClick={()=>setPayMethod(m)}
                  style={{padding:'10px 14px',border:`2px solid ${payMethod===m?'#0D9488':'#E2E8F0'}`,borderRadius:8,marginBottom:8,cursor:'pointer',background:payMethod===m?'#F0FDFA':'#fff',display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:16,height:16,borderRadius:'50%',border:`2px solid ${payMethod===m?'#0D9488':'#CBD5E1'}`,background:payMethod===m?'#0D9488':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {payMethod===m&&<div style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/>}
                  </div>
                  <span style={{fontSize:13,fontWeight:payMethod===m?600:400,color:payMethod===m?'#0D9488':'#475569'}}>{m}</span>
                </div>
              ))}
              <div style={{marginTop:14,padding:'12px 14px',background:'#F8FAFC',borderRadius:8,fontSize:12}}>
                <div style={{fontWeight:600,marginBottom:6,color:'#0F172A'}}>Coordonn\u00e9es bancaires</div>
                <div style={{color:'#64748B',lineHeight:1.8}}>
                  <div>Banque: <strong style={{color:'#0F172A'}}>{ci.bank||'—'}</strong></div>
                  <div>RIB: <span style={{fontFamily:'monospace',fontSize:11}}>{ci.rib||'—'}</span></div>
                  <div>IBAN: <span style={{fontFamily:'monospace',fontSize:11}}>{ci.iban||'—'}</span></div>
                  <div>SWIFT: <strong style={{color:'#0F172A'}}>{ci.swift||'—'}</strong></div>
                </div>
              </div>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:12}}>
            <button className="btn btn-ghost" onClick={()=>setStep(0)}>\u2190 Retour</button>
            <button className="btn btn-primary" disabled={!canNext} onClick={()=>setStep(2)} style={{opacity:canNext?1:0.5}}>
              Suivant \u2192 Pr\u00e9visualiser la facture
            </button>
          </div>
        </div>
      )}

      {/* ── STEP 2: Invoice preview ── */}
      {step===2&&(
        <div>
          <div style={{display:'flex',gap:10,marginBottom:14,justifyContent:'flex-end'}} className="no-print">
            <button className="btn btn-ghost" onClick={()=>setStep(1)}>\u2190 Modifier</button>
            <button className="btn btn-ghost" onClick={()=>window.print()}><Icon name="printer" size={14}/>Imprimer</button>
            <button className="btn btn-primary" onClick={()=>setStep(3)}>
              Suivant \u2192 Joindre documents
            </button>
          </div>
          <InvoiceView order={{invoiceNo,date:today(),client,items:orderItems,subtotal,discount,discountAmt,total,tva,totalTTC,payMethod,notes}} ci={ci}/>
        </div>
      )}

      {/* ── STEP 3: Documents ── */}
      {step===3&&(
        <div>
          <div className="two-col">
            <div className="card">
              <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:600,marginBottom:4}}>
                \uD83D\uDCE6 Bordereau d\u2019exp\u00e9dition
              </div>
              <div style={{fontSize:12,color:'#94A3B8',marginBottom:12}}>Photo du bon de livraison / bordereau</div>
              <div className={`upload-zone${shipPhoto?' has-file':''}`} onClick={()=>shipRef.current.click()}>
                {shipPhoto
                  ?<img src={shipPhoto} alt="Bordereau" style={{maxWidth:'100%',maxHeight:240,borderRadius:6,objectFit:'contain'}}/>
                  :<div>
                    <Icon name="image" size={32} style={{margin:'0 auto 8px',display:'block',color:'#94A3B8'}}/>
                    <div style={{fontSize:13,fontWeight:500,color:'#64748B'}}>Cliquer pour charger</div>
                    <div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>JPG, PNG, WEBP — max 5 Mo</div>
                  </div>
                }
              </div>
              <input ref={shipRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handlePhoto(e.target.files[0],setShipPhoto)}/>
              {shipPhoto&&<button className="btn btn-danger btn-sm" style={{marginTop:8}} onClick={()=>setShipPhoto(null)}>Supprimer</button>}
            </div>
            <div className="card">
              <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:600,marginBottom:4}}>
                \uD83E\uDDFE Re\u00e7u de paiement
              </div>
              <div style={{fontSize:12,color:'#94A3B8',marginBottom:12}}>Photo du virement, ch\u00e8que ou re\u00e7u</div>
              <div className={`upload-zone${receiptPhoto?' has-file':''}`} onClick={()=>recRef.current.click()}>
                {receiptPhoto
                  ?<img src={receiptPhoto} alt="Re\u00e7u" style={{maxWidth:'100%',maxHeight:240,borderRadius:6,objectFit:'contain'}}/>
                  :<div>
                    <Icon name="image" size={32} style={{margin:'0 auto 8px',display:'block',color:'#94A3B8'}}/>
                    <div style={{fontSize:13,fontWeight:500,color:'#64748B'}}>Cliquer pour charger</div>
                    <div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>JPG, PNG, WEBP — max 5 Mo</div>
                  </div>
                }
              </div>
              <input ref={recRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handlePhoto(e.target.files[0],setReceiptPhoto)}/>
              {receiptPhoto&&<button className="btn btn-danger btn-sm" style={{marginTop:8}} onClick={()=>setReceiptPhoto(null)}>Supprimer</button>}
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:14}}>
            <button className="btn btn-ghost" onClick={()=>setStep(2)}>\u2190 Retour</button>
            <button className="btn btn-primary" style={{background:'#10B981',padding:'10px 24px'}} onClick={()=>{saveOrder();setStep(4);}}>
              <Icon name="check" size={15}/>\u00a0Finaliser la commande
            </button>
          </div>
        </div>
      )}

      {/* ── STEP 4: Confirmation ── */}
      {step===4&&(
        <div style={{textAlign:'center',padding:'40px 20px'}}>
          <div style={{width:64,height:64,borderRadius:'50%',background:'#DCFCE7',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
            <Icon name="check" size={28} style={{color:'#15803D'}}/>
          </div>
          <div style={{fontFamily:'Outfit',fontSize:22,fontWeight:700,color:'#0F172A',marginBottom:6}}>Commande enregistr\u00e9e !</div>
          <div style={{fontSize:14,color:'#64748B',marginBottom:8}}>N\u00b0 Facture : <strong>{invoiceNo}</strong></div>
          <div style={{fontSize:14,color:'#64748B',marginBottom:24}}>Total TTC : <strong style={{color:'#0D9488'}}>{fmtMAD(totalTTC)}</strong></div>
          <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
            <button className="btn btn-ghost" onClick={()=>window.print()}><Icon name="printer" size={14}/>Imprimer la facture</button>
            <button className="btn btn-primary" onClick={reset}>
              <Icon name="plus" size={14}/>Nouvelle commande
            </button>
          </div>
        </div>
      )}

      {/* ── Orders history ── */}
      {(data.wholesaleOrders||[]).length>0&&step!==4&&(
        <div style={{marginTop:28}}>
          <div style={{fontFamily:'Outfit',fontSize:15,fontWeight:600,marginBottom:12,color:'#0F172A',borderTop:'2px solid #E2E8F0',paddingTop:20}}>
            Historique des commandes grossistes
          </div>
          <div className="card" style={{padding:0}}>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>N\u00b0 Facture</th><th>Date</th><th>Client</th><th>Articles</th>
                    <th>Total TTC</th><th>Paiement</th><th>Docs</th><th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {[...(data.wholesaleOrders||[])].sort((a,b)=>b.date.localeCompare(a.date)).map(o=>(
                    <tr key={o.id}>
                      <td><span style={{fontFamily:'monospace',fontSize:12,background:'#F1F5F9',padding:'2px 6px',borderRadius:4}}>{o.invoiceNo}</span></td>
                      <td style={{fontSize:12,color:'#64748B'}}>{o.date}</td>
                      <td>
                        <div style={{fontWeight:500,fontSize:13}}>{o.client.name}</div>
                        {o.client.company&&<div style={{fontSize:11,color:'#94A3B8'}}>{o.client.company}</div>}
                      </td>
                      <td style={{fontSize:12,color:'#64748B'}}>{o.items.length} produit{o.items.length!==1?'s':''}</td>
                      <td style={{fontWeight:700,color:'#0D9488'}}>{fmtMAD(o.totalTTC)}</td>
                      <td><span className="tag" style={{fontSize:11}}>{o.payMethod}</span></td>
                      <td>
                        <div style={{display:'flex',gap:4}}>
                          {o.shipPhoto&&<span title="Bordereau joint" style={{fontSize:14}}>📦</span>}
                          {o.receiptPhoto&&<span title="Re\u00e7u joint" style={{fontSize:14}}>🧾</span>}
                          {!o.shipPhoto&&!o.receiptPhoto&&<span style={{color:'#CBD5E1',fontSize:12}}>—</span>}
                        </div>
                      </td>
                      <td>
                        <div style={{display:'flex',gap:6}}>
                          <button className="btn btn-ghost btn-sm" onClick={()=>setViewOrder(o)}>
                            <Icon name="invoice" size={12}/>Facture
                          </button>
                          <button className="btn btn-danger btn-sm" onClick={()=>{
                            if(confirm('Supprimer cette commande?'))
                              update(d=>({...d,wholesaleOrders:(d.wholesaleOrders||[]).filter(x=>x.id!==o.id)}));
                          }}><Icon name="trash" size={12}/></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Invoice View Component ───────────────────────────────────────────────────
function InvoiceView({order,ci}){
  const o=order;
  return(
    <div className="inv-wrap" id="invoice-print">
      {/* Header */}
      <div className="inv-header">
        <div>
          <div style={{fontFamily:'Outfit',fontSize:22,fontWeight:800,color:'#fff',letterSpacing:'-0.5px'}}>{ci.name||'Votre Entreprise'}</div>
          <div style={{fontSize:12,color:'#94A3B8',marginTop:4,lineHeight:1.8}}>
            <div>{ci.address||''}</div>
            <div>{ci.city||''}</div>
            {ci.phone&&<div>T\u00e9l: {ci.phone}</div>}
            {ci.email&&<div>{ci.email}</div>}
          </div>
          <div style={{display:'flex',gap:12,marginTop:8,flexWrap:'wrap'}}>
            {ci.rc&&<span style={{fontSize:11,color:'#64748B'}}>RC: {ci.rc}</span>}
            {ci.if_num&&<span style={{fontSize:11,color:'#64748B'}}>IF: {ci.if_num}</span>}
            {ci.ice&&<span style={{fontSize:11,color:'#64748B'}}>ICE: {ci.ice}</span>}
          </div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontFamily:'Outfit',fontSize:28,fontWeight:700,color:'#0D9488'}}>FACTURE</div>
          <div style={{fontSize:13,color:'#fff',marginTop:4,fontFamily:'monospace',letterSpacing:'1px'}}>{o.invoiceNo}</div>
          <div style={{fontSize:12,color:'#94A3B8',marginTop:4}}>Date: {o.date}</div>
          <div style={{marginTop:8,padding:'6px 12px',background:'rgba(13,148,136,0.2)',borderRadius:6,display:'inline-block'}}>
            <div style={{fontSize:11,color:'#5EEAD4'}}>Mode de paiement</div>
            <div style={{fontSize:13,color:'#fff',fontWeight:600}}>{o.payMethod}</div>
          </div>
        </div>
      </div>

      {/* Client info */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:0,borderBottom:'1px solid #E2E8F0'}}>
        <div style={{padding:'18px 24px',borderRight:'1px solid #E2E8F0'}}>
          <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'#94A3B8',marginBottom:8}}>Facturer \u00e0</div>
          <div style={{fontWeight:700,fontSize:15,color:'#0F172A'}}>{o.client.name}</div>
          {o.client.company&&<div style={{fontSize:13,color:'#475569',marginTop:2}}>{o.client.company}</div>}
          <div style={{fontSize:12,color:'#64748B',lineHeight:1.8,marginTop:4}}>
            {o.client.address&&<div>{o.client.address}</div>}
            {o.client.city&&<div>{o.client.city}</div>}
            {o.client.phone&&<div>T\u00e9l: {o.client.phone}</div>}
            {o.client.email&&<div>{o.client.email}</div>}
            {o.client.ice&&<div style={{fontFamily:'monospace',fontSize:11}}>ICE: {o.client.ice}</div>}
          </div>
        </div>
        <div style={{padding:'18px 24px',background:'#FAFBFF'}}>
          <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',color:'#94A3B8',marginBottom:8}}>Coordonn\u00e9es bancaires</div>
          <div style={{fontSize:12,color:'#475569',lineHeight:2}}>
            <div>Banque: <strong style={{color:'#0F172A'}}>{ci.bank||'—'}</strong></div>
            <div>RIB: <span style={{fontFamily:'monospace',fontSize:11,background:'#F1F5F9',padding:'1px 4px',borderRadius:3}}>{ci.rib||'—'}</span></div>
            <div>IBAN: <span style={{fontFamily:'monospace',fontSize:11,background:'#F1F5F9',padding:'1px 4px',borderRadius:3}}>{ci.iban||'—'}</span></div>
            <div>SWIFT/BIC: <strong style={{color:'#0F172A'}}>{ci.swift||'—'}</strong></div>
          </div>
        </div>
      </div>

      {/* Items table */}
      <div style={{padding:'0 0'}}>
        <table className="inv-table" style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr>
              <th style={{width:'40%'}}>D\u00e9signation</th>
              <th style={{textAlign:'center'}}>Qt\u00e9</th>
              <th style={{textAlign:'right'}}>Prix unitaire HT</th>
              <th style={{textAlign:'right'}}>Total HT</th>
            </tr>
          </thead>
          <tbody>
            {o.items.map((item,i)=>(
              <tr key={i}>
                <td>
                  <div style={{fontWeight:500}}>{item.name}</div>
                  {item.category&&<div style={{fontSize:11,color:'#94A3B8'}}>{item.category}</div>}
                </td>
                <td style={{textAlign:'center',fontWeight:600}}>{item.qty}</td>
                <td style={{textAlign:'right'}}>{fmtMAD(item.unitPrice)}</td>
                <td style={{textAlign:'right',fontWeight:600,color:'#0F172A'}}>{fmtMAD(item.qty*item.unitPrice)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Totals */}
      <div style={{display:'flex',justifyContent:'flex-end',padding:'16px 24px',borderTop:'1px solid #E2E8F0'}}>
        <div style={{width:280}}>
          <div style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:13,color:'#64748B'}}>
            <span>Sous-total HT</span><span style={{fontWeight:500}}>{fmtMAD(o.subtotal)}</span>
          </div>
          {o.discount>0&&(
            <div style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:13,color:'#EF4444'}}>
              <span>Remise ({o.discount}%)</span><span>-{fmtMAD(o.discountAmt)}</span>
            </div>
          )}
          <div style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:13,color:'#64748B'}}>
            <span>Total HT</span><span style={{fontWeight:500}}>{fmtMAD(o.total)}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:13,color:'#64748B'}}>
            <span>TVA (20%)</span><span style={{fontWeight:500}}>{fmtMAD(o.tva)}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',padding:'10px 14px',background:'#0F172A',borderRadius:8,marginTop:8}}>
            <span style={{fontWeight:700,fontSize:15,color:'#fff'}}>TOTAL TTC</span>
            <span style={{fontWeight:800,fontSize:18,color:'#0D9488',fontFamily:'Outfit'}}>{fmtMAD(o.totalTTC)}</span>
          </div>
        </div>
      </div>

      {/* Notes */}
      {o.notes&&(
        <div style={{padding:'12px 24px',borderTop:'1px solid #E2E8F0',background:'#FAFBFF'}}>
          <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',color:'#94A3B8',marginBottom:4}}>Notes</div>
          <div style={{fontSize:12,color:'#475569'}}>{o.notes}</div>
        </div>
      )}

      {/* Photos if available */}
      {(o.shipPhoto||o.receiptPhoto)&&(
        <div style={{padding:'16px 24px',borderTop:'1px solid #E2E8F0',display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          {o.shipPhoto&&(
            <div>
              <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',color:'#94A3B8',marginBottom:8}}>📦 Bordereau d\u2019exp\u00e9dition</div>
              <img src={o.shipPhoto} alt="Bordereau" style={{width:'100%',maxHeight:200,objectFit:'contain',borderRadius:6,border:'1px solid #E2E8F0'}}/>
            </div>
          )}
          {o.receiptPhoto&&(
            <div>
              <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',color:'#94A3B8',marginBottom:8}}>🧾 Re\u00e7u de paiement</div>
              <img src={o.receiptPhoto} alt="Re\u00e7u" style={{width:'100%',maxHeight:200,objectFit:'contain',borderRadius:6,border:'1px solid #E2E8F0'}}/>
            </div>
          )}
        </div>
      )}

      {/* Footer */}
      <div style={{padding:'12px 24px',borderTop:'2px solid #0D9488',background:'#F0FDFA',textAlign:'center'}}>
        <div style={{fontSize:11,color:'#0F766E'}}>
          {ci.name||'Votre Entreprise'} — {ci.address||''} — {ci.phone||''} — {ci.email||''}
        </div>
        <div style={{fontSize:10,color:'#94A3B8',marginTop:2}}>
          Document g\u00e9n\u00e9r\u00e9 par TradeFlow Maroc ERP
        </div>
      </div>
    </div>
  );
}


// ─── QR Code Generator (pure JS, no lib needed) ──────────────────────────────
// Simple QR via Google Charts API (URL-based, works offline-ish via cache)
function QRCode({value,size=120}){
  const url=`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(value)}&format=svg&margin=4`;
  return(
    <div style={{background:'#fff',padding:6,borderRadius:8,border:'1px solid #E2E8F0',display:'inline-block'}}>
      <img src={url} width={size} height={size} alt={`QR: ${value}`} style={{display:'block'}}
        onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';}}/>
      <div style={{display:'none',width:size,height:size,alignItems:'center',justifyContent:'center',fontSize:10,color:'#94A3B8',textAlign:'center',padding:4}}>
        QR hors ligne
      </div>
    </div>
  );
}

const STATUS_COLORS={
  Préparé:{bg:'#FEF9C3',fg:'#854D0E',dot:'#F59E0B'},
  Expédié:{bg:'#DBEAFE',fg:'#1D4ED8',dot:'#3B82F6'},
  'En transit':{bg:'#EDE9FE',fg:'#6D28D9',dot:'#8B5CF6'},
  Livré:{bg:'#DCFCE7',fg:'#15803D',dot:'#10B981'},
  Retourné:{bg:'#FEE2E2',fg:'#B91C1C',dot:'#EF4444'},

};
const STATUS_EMOJI={Préparé:'📦',Expédié:'🚚','En transit':'🛣️',Livré:'✅',Retourné:'↩️',Annulé:'❌'};
const CARRIERS=['Amana','Aramex','CTM Messagerie','Chronopost','DHL','FedEx','Autre'];

function StatusChip({status}){

}

// ─── Logistics Page ───────────────────────────────────────────────────────────
function Logistics({data,update}){
  const[scanInput,setScanInput]=useState('');
  const[scanMode,setScanMode]=useState('usb'); // 'usb' | 'camera'
  const[foundShipment,setFoundShipment]=useState(null);
  const[flashId,setFlashId]=useState(null);
  const[statusModal,setStatusModal]=useState(null);
  const[newStatus,setNewStatus]=useState('');
  const[newNote,setNewNote]=useState('');
  const[newCarrier,setNewCarrier]=useState('');
  const[newTracking,setNewTracking]=useState('');
  const[createModal,setCreateModal]=useState(false);
  const[createForm,setCreateForm]=useState({orderId:'',orderType:'sale',client:'',product:'',qty:1,carrier:'',trackingNum:'',notes:''});
  const[detailId,setDetailId]=useState(null);
  const[filterStatus,setFilterStatus]=useState('');
  const[q,setQ]=useState('');
  const[cameraStream,setCameraStream]=useState(null);
  const[cameraError,setCameraError]=useState('');
  const scanRef=useRef();
  const videoRef=useRef();
  const scanBuffer=useRef('');
  const scanTimer=useRef(null);

  // Auto-focus scan input when in USB mode
  useEffect(()=>{
    if(scanMode==='usb'&&scanRef.current){
      scanRef.current.focus();
    }
  },[scanMode]);

  // USB scanner: reads as fast keyboard input ending with Enter
  const handleScanKeyDown=useCallback((e)=>{
    if(e.key==='Enter'){
      const val=scanInput.trim();
      if(val) processQR(val);
      setScanInput('');
      e.preventDefault();
    }
  },[scanInput,data]);

  // Also handle paste (some scanners paste)
  const handleScanPaste=useCallback((e)=>{
    const val=(e.clipboardData||window.clipboardData).getData('text').trim();
    if(val){setTimeout(()=>{processQR(val);setScanInput('');},50);}
  },[data]);

  // Global keypress fallback: if user types on any page element, capture to scan buffer
  useEffect(()=>{
    if(scanMode!=='usb')return;
    const handler=(e)=>{
      if(e.target===scanRef.current)return;
      if(e.key.length===1){
        scanBuffer.current+=e.key;
        clearTimeout(scanTimer.current);
        scanTimer.current=setTimeout(()=>{scanBuffer.current='';},100);
      } else if(e.key==='Enter'&&scanBuffer.current.length>3){
        processQR(scanBuffer.current.trim());
        scanBuffer.current='';
        clearTimeout(scanTimer.current);
      }
    };
    document.addEventListener('keypress',handler);
    return()=>{document.removeEventListener('keypress',handler);clearTimeout(scanTimer.current);};
  },[scanMode,data]);

  // Camera scan using jsQR lib
  const startCamera=async()=>{
    setCameraError('');
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      setCameraStream(stream);
      if(videoRef.current){
        videoRef.current.srcObject=stream;
        videoRef.current.play();
        scanCamera();
      }
    }catch(err){
      setCameraError('Impossible d\'accéder à la caméra: '+err.message);
    }
  };
  const stopCamera=()=>{
    if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());
    setCameraStream(null);
  };
  useEffect(()=>{if(scanMode!=='camera')stopCamera();},[scanMode]);

  const scanCamera=()=>{
    if(!videoRef.current)return;
    const canvas=document.createElement('canvas');
    const scan=()=>{
      if(!videoRef.current||videoRef.current.paused)return;
      canvas.width=videoRef.current.videoWidth||320;
      canvas.height=videoRef.current.videoHeight||240;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(videoRef.current,0,0);
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      if(window.jsQR){
        const code=window.jsQR(imgData.data,imgData.width,imgData.height);
        if(code&&code.data){processQR(code.data);return;}
      }
      requestAnimationFrame(scan);
    };
    videoRef.current.addEventListener('loadeddata',scan);
  };

  const processQR=useCallback((val)=>{
    const v=val.trim();
    if(!v)return;
    // PRIMARY: match by trackingNum (what the QR contains)
    // FALLBACK: match by internal id or orderId
    const ship=(data.shipments||[]).find(s=>
      (s.trackingNum&&s.trackingNum.trim()===v)||
      s.id===v||s.orderId===v||s.ref===v
    );
    if(ship){
      setFoundShipment(ship);
      setFlashId(ship.id);
      setNewStatus(ship.status);
      setNewNote('');
      setNewCarrier(ship.carrier||'');
      setNewTracking(ship.trackingNum||'');
      setStatusModal(ship);
      setTimeout(()=>setFlashId(null),800);
    } else {
      // Not found — show option to link this tracking number to an existing shipment
      setFoundShipment({error:true,value:v,isTracking:true});
      setStatusModal(null);
    }
  },[data.shipments]);

  const applyStatus=()=>{
    if(!statusModal||!newStatus)return;
    const ts=new Date().toISOString();
    const evtId='EVT'+uid();
    update(d=>({
      ...d,
      shipments:(d.shipments||[]).map(s=>
        s.id===statusModal.id
          ?{...s,status:newStatus,
            carrier:newCarrier||s.carrier,
            trackingNum:newTracking||s.trackingNum}
          :s
      ),
      trackingEvents:[...(d.trackingEvents||[]),{
        id:evtId,shipmentId:statusModal.id,
        status:newStatus,timestamp:ts,note:newNote,
      }],
    }));
    setStatusModal(null);
    setFoundShipment(null);
    setNewNote('');
  };

  const createShipment=()=>{
    if(!createForm.client||!createForm.product)return;
    const id='SHP'+uid();
    const ts=new Date().toISOString();
    update(d=>({
      ...d,
      shipments:[...(d.shipments||[]),{
        id,orderId:createForm.orderId||id,orderType:createForm.orderType,
        ref:createForm.orderId||id,client:createForm.client,
        product:createForm.product,qty:Number(createForm.qty),
        status:'Préparé',carrier:createForm.carrier,
        trackingNum:createForm.trackingNum,notes:createForm.notes,
        createdAt:today(),
      }],
      trackingEvents:[...(d.trackingEvents||[]),{
        id:'EVT'+uid(),shipmentId:id,status:'Préparé',timestamp:ts,note:'Colis créé',
      }],
    }));
    setCreateModal(false);
    setCreateForm({orderId:'',orderType:'sale',client:'',product:'',qty:1,carrier:'',trackingNum:'',notes:''});
  };

  const deleteShipment=id=>{
    if(!confirm('Supprimer ce suivi?'))return;
    update(d=>({
      ...d,
      shipments:(d.shipments||[]).filter(s=>s.id!==id),
      trackingEvents:(d.trackingEvents||[]).filter(e=>e.shipmentId!==id),
    }));
    if(detailId===id)setDetailId(null);
  };

  const shipments=data.shipments||[];
  const events=data.trackingEvents||[];

  const filtered=shipments.filter(s=>{
    const mq=!q||s.client.toLowerCase().includes(q.toLowerCase())||
      s.product.toLowerCase().includes(q.toLowerCase())||
      s.ref.toLowerCase().includes(q.toLowerCase())||
      s.id.toLowerCase().includes(q.toLowerCase())||
      (s.trackingNum&&s.trackingNum.toLowerCase().includes(q.toLowerCase()));
    const ms=!filterStatus||s.status===filterStatus;
    return mq&&ms;
  }).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

  const stats={
    total:shipments.length,
    prepared:shipments.filter(s=>s.status==='Préparé').length,
    shipped:shipments.filter(s=>s.status==='Expédié').length,
    transit:shipments.filter(s=>s.status==='En transit').length,
    delivered:shipments.filter(s=>s.status==='Livré').length,
    returned:shipments.filter(s=>s.status==='Retourné').length,
  };

  const detailShip=detailId?shipments.find(s=>s.id===detailId):null;
  const detailEvents=detailId?[...events.filter(e=>e.shipmentId===detailId)].sort((a,b)=>a.timestamp.localeCompare(b.timestamp)):[];

  return(
    <div>
      {/* ── KPIs ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10,marginBottom:20}}>
        {[
          {label:'Total',val:stats.total,color:'#0F172A',bg:'#F8FAFC'},
          {label:'📦 Préparé',val:stats.prepared,color:'#854D0E',bg:'#FEF9C3'},
          {label:'🚚 Expédié',val:stats.shipped,color:'#1D4ED8',bg:'#DBEAFE'},
          {label:'🛣 Transit',val:stats.transit,color:'#6D28D9',bg:'#EDE9FE'},
          {label:'✅ Livré',val:stats.delivered,color:'#15803D',bg:'#DCFCE7'},
          {label:'↩ Retourné',val:stats.returned,color:'#B91C1C',bg:'#FEE2E2'},
        ].map((k,i)=>(
          <div key={i} style={{background:k.bg,borderRadius:10,padding:'10px 12px',cursor:'pointer',border:`1px solid ${filterStatus===k.label.replace(/^[^ ]+ /,'')?k.color:'transparent'}`}}
            onClick={()=>setFilterStatus(filterStatus===k.label.replace(/^[^ ]+ /,'')?'':k.label.replace(/^[^ ]+ /,''))}>
            <div style={{fontSize:10,color:k.color,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.4px'}}>{k.label}</div>
            <div style={{fontFamily:'Outfit',fontSize:24,fontWeight:700,color:k.color}}>{k.val}</div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'340px 1fr',gap:20}}>
        {/* ── Left panel: Scanner ── */}
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="card" style={{padding:'16px 18px'}}>
            <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:700,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
              <Icon name="scan" size={16}/> Scanner QR
            </div>

            {/* Mode toggle */}
            <div style={{display:'flex',gap:6,marginBottom:14}}>
              {[{id:'usb',label:'📡 Lecteur USB'},{id:'camera',label:'📷 Caméra'}].map(m=>(
                <button key={m.id} onClick={()=>{setScanMode(m.id);setFoundShipment(null);if(m.id==='camera')startCamera();}}
                  style={{flex:1,padding:'7px 10px',borderRadius:7,border:`2px solid ${scanMode===m.id?'#0D9488':'#E2E8F0'}`,
                    background:scanMode===m.id?'#F0FDFA':'#fff',cursor:'pointer',fontSize:12,fontWeight:600,
                    color:scanMode===m.id?'#0D9488':'#64748B',transition:'all 0.15s'}}>
                  {m.label}
                </button>
              ))}
            </div>

            {/* USB input */}
            {scanMode==='usb'&&(
              <div>
                <div style={{position:'relative',marginBottom:10}}>
                  <input ref={scanRef} className="input" value={scanInput}
                    onChange={e=>setScanInput(e.target.value)}
                    onKeyDown={handleScanKeyDown}
                    onPaste={handleScanPaste}
                    placeholder="Pointez le lecteur ici et scannez..."
                    style={{paddingLeft:38,fontSize:13,borderColor:'#0D9488',
                      boxShadow:'0 0 0 3px rgba(13,148,136,0.1)'}}
                    autoFocus/>
                  <span style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'#0D9488'}}>
                    <Icon name="scan" size={15}/>
                  </span>
                </div>
                <div style={{fontSize:11,color:'#94A3B8',textAlign:'center',padding:'4px 0'}}>
                  Le champ est actif — scannez n'importe quand
                </div>
              </div>
            )}

            {/* Camera */}
            {scanMode==='camera'&&(
              <div>
                {cameraError&&<div className="alert alert-red" style={{marginBottom:10,fontSize:12}}>{cameraError}</div>}
                <div style={{position:'relative',background:'#0F172A',borderRadius:10,overflow:'hidden',aspectRatio:'4/3'}}>
                  <video ref={videoRef} style={{width:'100%',height:'100%',objectFit:'cover'}} muted playsInline/>
                  <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
                    <div style={{width:'60%',height:'60%',border:'2px solid #0D9488',borderRadius:12,position:'relative',boxShadow:'0 0 0 9999px rgba(0,0,0,0.45)'}}>
                      <div className="scan-line"/>
                    </div>
                  </div>
                </div>
                <div style={{fontSize:11,color:'#94A3B8',textAlign:'center',marginTop:8}}>
                  Centrez le QR code dans le cadre vert
                </div>
                <button className="btn btn-ghost" style={{width:'100%',marginTop:8,fontSize:12}} onClick={()=>{stopCamera();setScanMode('usb');}}>
                  Arrêter la caméra
                </button>
              </div>
            )}

            {/* Scan result */}
            {foundShipment&&(
              <div style={{marginTop:12,padding:'12px 14px',borderRadius:8,
                background:foundShipment.error?'#FEF2F2':'#F0FDF4',
                border:`1px solid ${foundShipment.error?'#FECACA':'#BBF7D0'}`}}>
                {foundShipment.error
                  ?<div>
                    <div style={{fontWeight:600,color:'#B91C1C',fontSize:13}}>⚠️ N° tracking non lié</div>
                    <div style={{fontSize:12,color:'#475569',marginTop:4}}>Numéro scanné :</div>
                    <div style={{fontSize:12,fontFamily:'monospace',background:'#FEE2E2',padding:'4px 8px',borderRadius:5,marginTop:3,color:'#991B1B',wordBreak:'break-all'}}>{foundShipment.value}</div>
                    <div style={{fontSize:11,color:'#94A3B8',marginTop:6,marginBottom:8}}>
                      Ce numéro de suivi n'est associé à aucun colis.<br/>Voulez-vous le lier à une commande ?
                    </div>
                    <button className="btn btn-primary btn-sm" style={{width:'100%',justifyContent:'center',marginBottom:6,fontSize:12}}
                      onClick={()=>{setCreateForm({...createForm,trackingNum:foundShipment.value,orderId:'',client:'',product:'',qty:1,carrier:'',notes:''});setCreateModal(true);}}>
                      🔗 Lier à une commande existante
                    </button>
                    <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center',fontSize:12}}
                      onClick={()=>setCreateModal(true)}>
                      + Créer un nouveau suivi
                    </button>
                  </div>
                  :<div>
                    <div style={{fontWeight:600,color:'#15803D',fontSize:13}}>✅ Colis trouvé!</div>
                    <div style={{fontSize:13,fontWeight:500,marginTop:4}}>{foundShipment.client}</div>
                    <div style={{fontSize:12,color:'#64748B'}}>{foundShipment.product}</div>
                    <div style={{marginTop:6}}><StatusChip status={foundShipment.status}/></div>
                  </div>
                }
              </div>
            )}
          </div>

          {/* Quick create */}
          <div className="card" style={{padding:'14px 16px'}}>
            <div style={{fontFamily:'Outfit',fontSize:13,fontWeight:600,marginBottom:10}}>Actions rapides</div>
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginBottom:8}} onClick={()=>setCreateModal(true)}>
              <Icon name="plus" size={14}/>Créer un suivi colis
            </button>
            <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={()=>setDetailId(null)}>
              <Icon name="refresh" size={13}/>Réinitialiser la vue
            </button>
          </div>
        </div>

        {/* ── Right panel: List or Detail ── */}
        <div>
          {detailShip
            ? /* ── Detail view ── */
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setDetailId(null)}>← Retour à la liste</button>
                  <div style={{display:'flex',gap:8}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>window.print()}>
                      <Icon name="printer" size={13}/>Imprimer
                    </button>
                    <button className="btn btn-primary btn-sm" onClick={()=>{setNewStatus(detailShip.status);setNewNote('');setNewCarrier('');setNewTracking('');setStatusModal(detailShip);}}>
                      Mettre à jour statut
                    </button>
                  </div>
                </div>
                <div className="two-col" style={{marginBottom:16}}>
                  <div className="card">
                    <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:700,marginBottom:12}}>Informations colis</div>
                    {[
                      ['ID Suivi',<span style={{fontFamily:'monospace',fontSize:12,background:'#F1F5F9',padding:'2px 6px',borderRadius:4}}>{detailShip.id}</span>],
                      ['Commande',detailShip.ref||detailShip.orderId],
                      ['Client',<strong>{detailShip.client}</strong>],
                      ['Produit',detailShip.product],
                      ['Quantité',detailShip.qty],
                      ['Transporteur',detailShip.carrier||<span style={{color:'#94A3B8'}}>—</span>],
                      ['N° Tracking',detailShip.trackingNum?<span style={{fontFamily:'monospace',fontSize:12}}>{detailShip.trackingNum}</span>:<span style={{color:'#94A3B8'}}>—</span>],
                      ['Statut',<StatusChip status={detailShip.status}/>],
                      ['Créé le',detailShip.createdAt],
                    ].map(([l,v],i)=>(
                      <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #F8FAFC',fontSize:13}}>
                        <span style={{color:'#64748B'}}>{l}</span><span>{v}</span>
                      </div>
                    ))}
                  </div>
                  <div className="card" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
                    <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:700}}>QR Code colis</div>
                    <QRCode value={detailShip.id} size={140}/>
                    <div style={{fontSize:11,color:'#94A3B8',textAlign:'center'}}>
                      Scannez ce code pour accéder<br/>rapidement à ce colis
                    </div>
                    <div style={{fontSize:12,fontFamily:'monospace',background:'#F1F5F9',padding:'4px 10px',borderRadius:5,color:'#475569'}}>
                      {detailShip.id}
                    </div>
                  </div>
                </div>
                {/* Timeline */}
                <div className="card">
                  <div style={{fontFamily:'Outfit',fontSize:14,fontWeight:700,marginBottom:16}}>Timeline de livraison</div>
                  {detailEvents.length===0
                    ?<div style={{textAlign:'center',color:'#94A3B8',fontSize:13,padding:'20px 0'}}>Aucun événement enregistré</div>
                    :<div style={{paddingLeft:8}}>
                      {detailEvents.map((evt,i)=>{
                        const isLast=i===detailEvents.length-1;
                        const sc=STATUS_COLORS[evt.status]||{dot:'#94A3B8',fg:'#64748B'};
                        const d=new Date(evt.timestamp);
                        return(
                          <div key={evt.id} style={{display:'flex',gap:14,paddingBottom:isLast?0:16}}>
                            <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>

                            </div>
                            <div style={{flex:1,paddingTop:0}}>
                              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
                                <StatusChip status={evt.status}/>

                              </div>

                </div>
              </div>

            : /* ── List view ── */
              <div>
                <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
                  <SearchInput value={q} onChange={setQ} placeholder="Client, produit, ref, tracking..."/>
                  <select className="select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{width:160,fontSize:13}}>
                    <option value="">Tous les statuts</option>
                    {STATUSES.map(s=><option key={s}>{s}</option>)}
                  </select>
                </div>
                <div className="card" style={{padding:0}}>
                  <div className="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>QR / ID</th><th>Client</th><th>Produit</th>
                          <th>Transporteur</th><th>Statut</th><th>Date</th><th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filtered.length===0&&(
                          <tr><td colSpan={7}>
                            <div className="empty-state">
                              <div style={{fontSize:32,marginBottom:8}}>📭</div>
                              Aucun colis trouvé
                            </div>
                          </td></tr>
                        )}
                        {filtered.map(s=>(
                          <tr key={s.id} style={{background:flashId===s.id?'#F0FDFA':''}} className={flashId===s.id?'qr-found-flash':''}>
                            <td>
                              <div style={{fontFamily:'monospace',fontSize:11,background:'#F1F5F9',padding:'2px 6px',borderRadius:4,display:'inline-block'}}>{s.id}</div>
                              {s.trackingNum&&<div style={{fontSize:10,color:'#94A3B8',marginTop:2}}>{s.trackingNum}</div>}
                            </td>
                            <td style={{fontWeight:500,fontSize:13}}>{s.client}</td>
                            <td style={{fontSize:12,color:'#475569'}}>{s.product}<br/><span style={{fontSize:11,color:'#94A3B8'}}>×{s.qty}</span></td>
                            <td style={{fontSize:12,color:'#64748B'}}>{s.carrier||<span style={{color:'#CBD5E1'}}>—</span>}</td>
                            <td><StatusChip status={s.status}/></td>
                            <td style={{fontSize:11,color:'#94A3B8'}}>{s.createdAt}</td>
                            <td>
                              <div style={{display:'flex',gap:5}}>
                                <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>setDetailId(s.id)}>
                                  <Icon name="mappin" size={12}/>Détails
                                </button>
                                <button className="btn btn-ghost btn-sm" style={{fontSize:11,color:'#0D9488',borderColor:'#99F6E4'}}
                                  onClick={()=>{setNewStatus(s.status);setNewNote('');setNewCarrier(s.carrier||'');setNewTracking(s.trackingNum||'');setStatusModal(s);}}>
                                  Statut
                                </button>
                                <button className="btn btn-danger btn-sm" style={{padding:'4px 8px'}} onClick={()=>deleteShipment(s.id)}>
                                  <Icon name="trash" size={12}/>
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
          }
        </div>
      </div>

      {/* ── Status update modal ── */}
      <Modal title="Mettre à jour le statut" open={!!statusModal} onClose={()=>setStatusModal(null)}>
        {statusModal&&(
          <div>
            <div style={{background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:8,padding:'10px 14px',marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:13}}>{statusModal.client}</div>
              <div style={{fontSize:12,color:'#64748B'}}>{statusModal.product} — <span style={{fontFamily:'monospace'}}>{statusModal.id}</span></div>
              <div style={{marginTop:6}}><StatusChip status={statusModal.status}/></div>
            </div>
            <div className="form-group">
              <label className="label">Nouveau statut</label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}}>
                {STATUSES.map(s=>{
                  const sc=STATUS_COLORS[s]||{bg:'#F1F5F9',fg:'#64748B'};
                  return(
                    <button key={s} type="button" onClick={()=>setNewStatus(s)}
                      style={{padding:'8px 6px',borderRadius:7,border:`2px solid ${newStatus===s?sc.fg:'#E2E8F0'}`,
                        background:newStatus===s?sc.bg:'#fff',cursor:'pointer',fontSize:12,fontWeight:600,
                        color:newStatus===s?sc.fg:'#64748B',transition:'all 0.12s',textAlign:'center'}}>
                      <div style={{fontSize:15}}>{STATUS_EMOJI[s]}</div>
                      <div style={{marginTop:2}}>{s}</div>
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="two-col">
              <div className="form-group">
                <label className="label">Transporteur</label>
                <select className="select" value={newCarrier} onChange={e=>setNewCarrier(e.target.value)}>
                  <option value="">Inchangé</option>
                  {CARRIERS.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="label">N° Tracking</label>
                <input className="input" value={newTracking} onChange={e=>setNewTracking(e.target.value)} placeholder="Laisser vide = inchangé"/>
              </div>
            </div>
            <div className="form-group">
              <label className="label">Note (optionnel)</label>
              <input className="input" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Ex: Livré en mains propres..."/>
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="btn btn-ghost" onClick={()=>setStatusModal(null)}>Annuler</button>
              <button className="btn btn-primary" onClick={applyStatus}>
                <Icon name="check" size={14}/>Confirmer — {newStatus}
              </button>
            </div>
          </div>
        )}
      </Modal>

      {/* ── Create shipment modal ── */}
      <Modal title="Créer un suivi colis" open={createModal} onClose={()=>setCreateModal(false)}>
        <div className="two-col">
          <div className="form-group">
            <label className="label">Client *</label>
            <input className="input" value={createForm.client} onChange={e=>setCreateForm({...createForm,client:e.target.value})} placeholder="Nom du client"/>
          </div>
          <div className="form-group">
            <label className="label">Produit *</label>
            <select className="select" value={createForm.product} onChange={e=>setCreateForm({...createForm,product:e.target.value})}>
              <option value="">Sélectionner...</option>
              {data.products.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
              <option value="__custom">Autre produit...</option>
            </select>
          </div>
        </div>
        {createForm.product==='__custom'&&(
          <div className="form-group">
            <label className="label">Nom du produit</label>
            <input className="input" value={createForm.customProduct||''} onChange={e=>setCreateForm({...createForm,customProduct:e.target.value})} placeholder="Nom personnalisé"/>
          </div>
        )}
        <div className="two-col">
          <div className="form-group">
            <label className="label">Quantité</label>
            <input className="input" type="number" min="1" value={createForm.qty} onChange={e=>setCreateForm({...createForm,qty:e.target.value})}/>
          </div>
          <div className="form-group">
            <label className="label">Réf. commande</label>
            <select className="select" value={createForm.orderId} onChange={e=>setCreateForm({...createForm,orderId:e.target.value})}>
              <option value="">Aucune</option>
              {data.sales.map(s=>{const p=data.products.find(pr=>pr.id===s.productId);return<option key={s.id} value={s.id}>{s.id} — {p?p.name:'?'}</option>;})}
            </select>
          </div>
        </div>
        <div className="two-col">
          <div className="form-group">
            <label className="label">Transporteur</label>
            <select className="select" value={createForm.carrier} onChange={e=>setCreateForm({...createForm,carrier:e.target.value})}>
              <option value="">— Choisir —</option>
              {CARRIERS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="label">N° Tracking</label>
            <input className="input" value={createForm.trackingNum} onChange={e=>setCreateForm({...createForm,trackingNum:e.target.value})} placeholder="Ex: AM123456789MA"/>
          </div>
        </div>
        <div className="form-group">
          <label className="label">Notes</label>
          <input className="input" value={createForm.notes} onChange={e=>setCreateForm({...createForm,notes:e.target.value})} placeholder="Instructions spéciales..."/>
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={()=>setCreateModal(false)}>Annuler</button>
          <button className="btn btn-primary" onClick={()=>{
            const finalProduct=createForm.product==='__custom'?(createForm.customProduct||'Produit'):createForm.product;
            setCreateForm({...createForm,product:finalProduct});
            createShipment();
          }}>
            <Icon name="check" size={14}/>Créer le suivi
          </button>
        </div>
      </Modal>
    </div>
  );
}

// ─── Admin Page ───────────────────────────────────────────────────────────────
function Admin({data,update,calcs}){
  const[section,setSection]=useState('company');
  const[saved,setSaved]=useState('');
  const ci=data.companyInfo||{};
  const st=data.settings||{};

  // Company form
  const[company,setCompany]=useState({
    name:ci.name||'',address:ci.address||'',city:ci.city||'',
    phone:ci.phone||'',email:ci.email||'',
    rc:ci.rc||'',if_num:ci.if_num||'',ice:ci.ice||'',
    bank:ci.bank||'',rib:ci.rib||'',iban:ci.iban||'',swift:ci.swift||'',
    logo:ci.logo||'',
  });

  // Settings form
  const[settings,setSettings]=useState({
    exchangeRate:st.exchangeRate||1.90,
    lowStockThreshold:st.lowStockThreshold||5,
    tvaRate:st.tvaRate||20,
    currency:st.currency||'MAD',
    autoLogoutMinutes:st.autoLogoutMinutes||60,
  });

  // Password form
  const[pwForm,setPwForm]=useState({current:'',next:'',confirm:''});
  const[pwVisible,setPwVisible]=useState({current:false,next:false,confirm:false});
  const[pwError,setPwError]=useState('');

  const logoRef=useRef();

  const flash=(msg)=>{setSaved(msg);setTimeout(()=>setSaved(''),2500);};

  const saveCompany=()=>{
    update(d=>({...d,companyInfo:{...d.companyInfo,...company}}));
    flash('Informations entreprise sauvegardées ✓');
  };

  const saveSettings=()=>{
    update(d=>({...d,settings:{...d.settings,...settings}}));
    flash('Paramètres sauvegardés ✓');
  };

  const changePassword=()=>{
    setPwError('');
    const cur=data.settings?.adminPassword||'admin123';
    if(pwForm.current!==cur){setPwError('Mot de passe actuel incorrect');return;}
    if(pwForm.next.length<6){setPwError('Le nouveau mot de passe doit faire au moins 6 caractères');return;}
    if(pwForm.next!==pwForm.confirm){setPwError('Les mots de passe ne correspondent pas');return;}
    update(d=>({...d,settings:{...d.settings,adminPassword:pwForm.next}}));
    setPwForm({current:'',next:'',confirm:''});
    flash('Mot de passe modifié ✓');
  };

  const handleLogo=(file)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>setCompany({...company,logo:e.target.result});
    reader.readAsDataURL(file);
  };

  const exportData=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='tradeflow_backup_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();URL.revokeObjectURL(url);
    flash('Export téléchargé ✓');
  };

  const importData=()=>{
    const input=document.createElement('input');
    input.type='file';input.accept='.json';
    input.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const parsed=JSON.parse(ev.target.result);
          if(!parsed.products||!parsed.suppliers)throw new Error('Format invalide');
          if(confirm('Importer ces données ? Cela remplacera toutes les données actuelles.')){
            localStorage.setItem('tradeflow_maroc_v1',JSON.stringify(parsed));
            window.location.reload();
          }
        }catch(err){alert('Fichier invalide : '+err.message);}
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const resetDemo=()=>{
    if(!confirm('Réinitialiser TOUTES les données aux valeurs de démonstration ?\nCette action est irréversible.'))return;
    localStorage.removeItem('tradeflow_maroc_v1');
    window.location.reload();
  };

  const clearAll=()=>{
    if(!confirm('ATTENTION : Supprimer toutes les données ?\nToutes vos commandes, produits, achats seront effacés définitivement.'))return;
    if(!confirm('Êtes-vous absolument certain ? Cette action est IRRÉVERSIBLE.'))return;
    localStorage.removeItem('tradeflow_maroc_v1');
    window.location.reload();
  };

  // Storage stats
  const storageSize=new Blob([localStorage.getItem('tradeflow_maroc_v1')||'']).size;
  const storageSizeKB=(storageSize/1024).toFixed(1);
  const storagePercent=Math.min(100,(storageSize/(5*1024*1024))*100);
  const moduleStats=[
    {label:'Produits',count:data.products?.length||0,icon:'box',color:'#6366F1'},
    {label:'Fournisseurs',count:data.suppliers?.length||0,icon:'users',color:'#0D9488'},
    {label:'Clients (gros)',count:(data.wholesaleOrders||[]).length,icon:'truck',color:'#8B5CF6'},
    {label:'Achats',count:data.purchases?.length||0,icon:'shoppingcart',color:'#3B82F6'},
    {label:'Ventes',count:data.sales?.length||0,icon:'trendingup',color:'#10B981'},
    {label:'Employés',count:data.employees?.length||0,icon:'briefcase',color:'#F59E0B'},
    {label:'Commandes gros',count:(data.wholesaleOrders||[]).length,icon:'invoice',color:'#EC4899'},
    {label:'Colis suivis',count:(data.shipments||[]).length,icon:'scan',color:'#14B8A6'},
    {label:'Paiements fournis.',count:(data.supplierPayments||[]).length,icon:'dollar',color:'#EF4444'},
    {label:'Salaires payés',count:(data.salaryPayments||[]).length,icon:'award',color:'#84CC16'},
  ];

  const SECTIONS=[
    {id:'company',label:'Entreprise',icon:'building'},
    {id:'security',label:'Sécurité',icon:'shield'},
    {id:'settings',label:'Paramètres',icon:'sliders'},
    {id:'data',label:'Données',icon:'database'},
    {id:'stats',label:'Statistiques',icon:'chart'},
  ];

  const sectionTitle={
    company:'Informations de l\'entreprise',
    security:'Sécurité & Accès',
    settings:'Paramètres métier',
    data:'Données & Sauvegarde',
    stats:'Statistiques système',
  };

  return(
    <div style={{display:'grid',gridTemplateColumns:'200px 1fr',gap:20}}>
      {/* ── Sidebar tabs ── */}
      <div className="card" style={{padding:'10px 8px',height:'fit-content',position:'sticky',top:80}}>
        <div style={{fontFamily:'Outfit',fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'1px',padding:'4px 10px 10px'}}>
          Sections
        </div>
        {SECTIONS.map(s=>(
          <button key={s.id} onClick={()=>setSection(s.id)}
            style={{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'9px 10px',borderRadius:8,
              border:'none',cursor:'pointer',fontSize:13,fontWeight:500,textAlign:'left',marginBottom:2,
              background:section===s.id?'#0D9488':' transparent',
              color:section===s.id?'#fff':'#475569',
              transition:'all 0.12s'}}>
            <Icon name={s.icon} size={14}/>
            {s.label}
          </button>
        ))}
      </div>

      {/* ── Main content ── */}
      <div>
        {/* Save flash */}
        {saved&&(
          <div className="alert alert-green" style={{marginBottom:16,animation:'fadein 0.3s'}}>
            <Icon name="check" size={14}/>{saved}
          </div>
        )}

        <div style={{fontFamily:'Outfit',fontSize:17,fontWeight:700,marginBottom:18,color:'#0F172A'}}>
          {sectionTitle[section]}
        </div>

        {/* ── COMPANY ── */}
        {section==='company'&&(
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div className="card">
              <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:14}}>
                Identité

              <div className="two-col">
                <div className="form-group"><label className="label">Nom de l'entreprise</label><input className="input" value={company.name} onChange={e=>setCompany({...company,name:e.target.value})} placeholder="TradeFlow Maroc SARL"/></div>
                <div className="form-group"><label className="label">Email</label><input className="input" type="email" value={company.email} onChange={e=>setCompany({...company,email:e.target.value})} placeholder="contact@entreprise.ma"/></div>
              </div>
              <div className="two-col">
                <div className="form-group"><label className="label">Téléphone</label><input className="input" value={company.phone} onChange={e=>setCompany({...company,phone:e.target.value})} placeholder="+212 5xx xxx xxx"/></div>

              <div className="form-group"><label className="label">RIB</label><input className="input" style={{fontFamily:'monospace'}} value={company.rib} onChange={e=>setCompany({...company,rib:e.target.value})} placeholder="145 810 0123456789012345 67"/></div>

            </div>

                {company.logo
