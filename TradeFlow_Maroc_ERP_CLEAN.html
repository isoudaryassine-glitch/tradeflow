<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TradeFlow Maroc — ERP System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:#0F172A;overflow-x:hidden;}
:root{
  --sidebar:#0F172A;
  --sidebar-hover:#1E293B;
  --accent:#0D9488;
  --accent-light:#CCFBF1;
  --accent-dark:#0F766E;
  --danger:#EF4444;
  --warning:#F59E0B;
  --success:#10B981;
  --card:#FFFFFF;
  --border:#E2E8F0;
  --text-muted:#64748B;
  --text-secondary:#475569;
}
h1,h2,h3,h4,h5{font-family:'Outfit',sans-serif;}
.sidebar{width:240px;background:var(--sidebar);height:100vh;position:fixed;left:0;top:0;display:flex;flex-direction:column;z-index:100;transition:transform 0.3s;}
.logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.07);}
.logo-text{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.3px;}
.logo-sub{font-size:11px;color:#64748B;margin-top:2px;text-transform:uppercase;letter-spacing:1px;}
.nav-section{padding:12px 12px 0;flex:1;overflow-y:auto;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#334155;font-weight:600;padding:8px 8px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#94A3B8;font-size:13.5px;font-weight:500;transition:all 0.15s;margin-bottom:2px;text-decoration:none;}
.nav-item:hover{background:var(--sidebar-hover);color:#CBD5E1;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.7;}
.main{margin-left:240px;min-height:100vh;background:#F1F5F9;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.page-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;color:#0F172A;}
.content{padding:24px 28px;}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:20px;}
.card-sm{padding:16px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.btn-ghost:hover{background:#F8FAFC;color:#0F172A;}
.btn-danger{background:#FEF2F2;color:var(--danger);border:1px solid #FECACA;}
.btn-danger:hover{background:#FEE2E2;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:'Inter',sans-serif;color:#0F172A;background:#fff;outline:none;transition:border 0.15s;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,0.1);}
.select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:'Inter',sans-serif;color:#0F172A;background:#fff;outline:none;cursor:pointer;}
.select:focus{border-color:var(--accent);}
.label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:5px;}
.form-group{margin-bottom:14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border);position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 0 0 100%;opacity:0.08;}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
.kpi-value{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;margin:6px 0 4px;color:#0F172A;}
.kpi-sub{font-size:12px;color:var(--text-muted);}
.kpi-icon{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{padding:10px 14px;text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);border-bottom:1px solid var(--border);background:#F8FAFC;}
td{padding:11px 14px;border-bottom:1px solid #F1F5F9;color:#1E293B;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFBFC;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;}
.badge-green{background:#DCFCE7;color:#15803D;}
.badge-red{background:#FEE2E2;color:#B91C1C;}
.badge-yellow{background:#FEF9C3;color:#854D0E;}
.badge-blue{background:#DBEAFE;color:#1D4ED8;}
.badge-teal{background:var(--accent-light);color:var(--accent-dark);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,0.15);}
.modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;}
.modal-body{padding:20px 24px 24px;}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;}
.alert-red{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;}
.alert-yellow{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A;}
.alert-green{background:#F0FDF4;color:#14532D;border:1px solid #BBF7D0;}
.progress{height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden;}
.progress-bar{height:100%;border-radius:3px;transition:width 0.5s;}
.text-muted{color:var(--text-muted);}
.text-sm{font-size:13px;}
.font-mono{font-family:monospace;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;color:#0F172A;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:380px;}
.stat-change{font-size:11.5px;font-weight:500;}
.stat-up{color:var(--success);}
.stat-down{color:var(--danger);}
@media(max-width:768px){
  .sidebar{transform:translateX(-240px);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .content{padding:16px;}
  .topbar{padding:0 16px;}
}
.scroll-lock{overflow:hidden;}
.global-search-wrap{position:relative;}
.global-search-results{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:300;max-height:360px;overflow-y:auto;}
.gs-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:10px;}
.gs-item:hover{background:#F8FAFC;}
.gs-item:last-child{border-bottom:none;}
.gs-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:2px 6px;border-radius:4px;flex-shrink:0;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:#EF4444;position:absolute;top:4px;right:4px;}
.notif-panel{position:absolute;top:52px;right:0;width:320px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:300;}
.notif-item{padding:12px 16px;border-bottom:1px solid #F8FAFC;display:flex;gap:10px;align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.cod-badge-Payé{background:#DCFCE7;color:#15803D;}
.cod-badge-Non-payé{background:#FEE2E2;color:#B91C1C;}
.cod-badge-Partiel{background:#FEF9C3;color:#854D0E;}
.cod-badge-Livré{background:#DCFCE7;color:#15803D;}
.cod-badge-Expédié{background:#DBEAFE;color:#1D4ED8;}
.cod-badge-En-transit{background:#EDE9FE;color:#6D28D9;}
.cod-badge-Préparé{background:#FEF9C3;color:#854D0E;}
.cod-badge-Retourné{background:#FEE2E2;color:#B91C1C;}
.cod-badge-Annulé{background:#F1F5F9;color:#64748B;}
.client-card{border:1.5px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s;background:#fff;}
.client-card:hover{border-color:#0D9488;background:#F0FDFA;}
.client-card.selected{border-color:#0D9488;background:#F0FDFA;}
@media print{
  .sidebar,.topbar,.btn,.modal-overlay,#no-print{display:none!important;}
  .main{margin-left:0!important;}
  body{background:#fff!important;}
  .card{border:1px solid #ccc!important;break-inside:avoid;}
  .print-title{display:block!important;}
}
.print-title{display:none;}
.scan-ring{animation:scanpulse 1.8s ease-in-out infinite;}
@keyframes scanpulse{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,0.4);}50%{box-shadow:0 0 0 12px rgba(13,148,136,0);}}
.scan-line{position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#0D9488,transparent);animation:scanline 2s ease-in-out infinite;}
@keyframes scanline{0%{top:15%;}100%{top:85%;}transform:{}}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.status-Préparé{background:#FEF9C3;color:#854D0E;}
.status-Expédié{background:#DBEAFE;color:#1D4ED8;}
.status-En-transit{background:#EDE9FE;color:#6D28D9;}
.status-Livré{background:#DCFCE7;color:#15803D;}
.status-Retourné{background:#FEE2E2;color:#B91C1C;}
.status-Annulé{background:#F1F5F9;color:#64748B;}
.timeline-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.timeline-line{width:2px;background:#E2E8F0;flex:1;min-height:20px;margin:3px auto;}
.qr-found-flash{animation:flashborder 0.4s ease;}
@keyframes flashborder{0%,100%{border-color:#0D9488;}50%{border-color:#10B981;box-shadow:0 0 0 4px rgba(16,185,129,0.3);}}
.ws-step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;border:1.5px solid var(--border);transition:all 0.15s;background:#fff;}
.ws-step.active{background:#0D9488;color:#fff;border-color:#0D9488;}
.ws-step.done{background:#E8F5E9;color:#15803D;border-color:#BBF7D0;}
.ws-step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(0,0,0,0.1);flex-shrink:0;}
.ws-step.active .ws-step-num{background:rgba(255,255,255,0.25);}
.ws-step.done .ws-step-num{background:#BBF7D0;color:#15803D;}
.prod-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.prod-card{border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all 0.15s;background:#fff;position:relative;}
.prod-card:hover{border-color:#0D9488;background:#F0FDFA;}
.prod-card.selected{border-color:#0D9488;background:#F0FDFA;}
.prod-card.selected::after{content:'✓';position:absolute;top:8px;right:8px;width:20px;height:20px;background:#0D9488;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.inv-wrap{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:0;overflow:hidden;}
.inv-header{background:#0F172A;padding:28px 32px;display:flex;justify-content:space-between;align-items:flex-start;}
.inv-table th{background:#F8FAFC;padding:9px 12px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#64748B;border-bottom:1px solid #E2E8F0;text-align:left;}
.inv-table td{padding:10px 12px;border-bottom:1px solid #F8FAFC;font-size:13px;vertical-align:middle;}
.inv-table tr:last-child td{border-bottom:none;}
.upload-zone{border:2px dashed #CBD5E1;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.15s;background:#FAFAFA;}
.upload-zone:hover{border-color:#0D9488;background:#F0FDFA;}
.upload-zone.has-file{border-color:#10B981;background:#F0FDF4;}
.cod-badge-Payé{background:#DCFCE7;color:#15803D;}
.cod-badge-Non-payé{background:#FEE2E2;color:#B91C1C;}
.cod-badge-Partiel{background:#FEF9C3;color:#854D0E;}
.cod-badge-Livré{background:#DCFCE7;color:#15803D;}
.cod-badge-Expédié{background:#DBEAFE;color:#1D4ED8;}
.cod-badge-En-transit{background:#EDE9FE;color:#6D28D9;}
.cod-badge-Préparé{background:#FEF9C3;color:#854D0E;}
.cod-badge-Retourné{background:#FEE2E2;color:#B91C1C;}
.cod-badge-Annulé{background:#F1F5F9;color:#64748B;}
.client-card{border:1.5px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s;background:#fff;}
.client-card:hover{border-color:#0D9488;background:#F0FDFA;}
.client-card.selected{border-color:#0D9488;background:#F0FDFA;}
@media print{
  .no-print,.sidebar,.topbar,.btn{display:none!important;}
  .main{margin-left:0!important;}
  .inv-wrap{border:none!important;box-shadow:none!important;}
}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:500;background:#F1F5F9;color:#475569;}
.close-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:4px;display:flex;align-items:center;}
.close-btn:hover{background:#F1F5F9;color:#0F172A;}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;font-family:'Outfit',sans-serif;}
.chart-container{position:relative;height:240px;}
.rate-badge{background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:600;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.two-col{grid-template-columns:1fr;}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ─── Utils ────────────────────────────────────────────────────────────────────
const fmt=(n,d=0)=>Number(n||0).toLocaleString('fr-MA',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtMAD=(n)=>`${fmt(n,2)} MAD`;
const fmtFranc=(n)=>`${fmt(n,2)} F`;
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();
const clsx=(...args)=>args.filter(Boolean).join(' ');

// ─── Storage ──────────────────────────────────────────────────────────────────
const STORE_KEY='tradeflow_maroc_v2';
const defaultData={
  auth:{loggedIn:false},
  products:[],
  suppliers:[],
  purchases:[],
  sales:[],
  supplierPayments:[],
  employees:[],
  workHours:[],
  orderBonuses:[],
  salaryPayments:[],
  companyInfo:{
    name:'',address:'',city:'',phone:'',email:'',
    rc:'',if_num:'',ice:'',
    bank:'',rib:'',iban:'',swift:'',logo:'',
  },
  wholesaleOrders:[],
  settings:{
    exchangeRate:1.90,
    lowStockThreshold:5,
    tvaRate:20,
    currency:'MAD',
    adminPassword:'admin123',
    autoLogoutMinutes:60,
    createdAt:'2025-01-01',
  },
  shipments:[],
  trackingEvents:[],
  clients:[],
  codOrders:[],
};

function useStore(){
  const [data,setData]=useState(()=>{
    try{
      const s=localStorage.getItem(STORE_KEY);
      if(!s)return defaultData;
      const saved=JSON.parse(s);
      // Merge: add any new top-level keys from defaultData that are missing in saved
      const merged={...defaultData,...saved};
      Object.keys(defaultData).forEach(k=>{
        if(merged[k]===undefined||merged[k]===null)merged[k]=defaultData[k];
        // If saved key is an empty array but default has sample data for new keys, keep saved (user may have cleared it)
        // But if key is completely missing from saved, use defaultData
        if(!(k in saved))merged[k]=defaultData[k];
      });
      return merged;
    }catch{return defaultData;}
  });
  const update=useCallback((fn)=>{
    setData(prev=>{const next=fn(prev);localStorage.setItem(STORE_KEY,JSON.stringify(next));return next;});
  },[]);
  return{data,update};
}

// ─── Icons (inline SVG) ───────────────────────────────────────────────────────
const Icon=({name,size=16,className=''})=>{
  const icons={
    dashboard:<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
    box:<><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,
    users:<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
    shoppingcart:<><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></>,
    trendingup:<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
    package:<><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,
    dollar:<><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
    plus:<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    edit:<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
    trash:<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></>,
    x:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,

// ─── Derived calculations ─────────────────────────────────────────────────────
function useCalcs(data){
  return useMemo(()=>{
    const{products,purchases,sales,suppliers,supplierPayments}=data;

    // Stock per product
    const stockMap={};
    const purchasedQty={};
    const soldQty={};
    products.forEach(p=>{stockMap[p.id]=0;purchasedQty[p.id]=0;soldQty[p.id]=0;});
    purchases.forEach(a=>{if(stockMap[a.productId]!==undefined){stockMap[a.productId]+=a.qty;purchasedQty[a.productId]+=a.qty;}});
    sales.forEach(v=>{if(stockMap[v.productId]!==undefined){stockMap[v.productId]-=v.qty;soldQty[v.productId]+=v.qty;}});

    // Average cost per product (MAD)
    const avgCostMap={};
    products.forEach(p=>{
      const pvh=purchases.filter(a=>a.productId===p.id);
      const totalMAD=pvh.reduce((s,a)=>s+a.qty*a.unitPriceFranc*a.exchangeRate,0);
      const totalQty=pvh.reduce((s,a)=>s+a.qty,0);
      avgCostMap[p.id]=totalQty>0?totalMAD/totalQty:0;
    });

    // Total purchases MAD
    const totalPurchasesMAD=purchases.reduce((s,a)=>s+a.qty*a.unitPriceFranc*a.exchangeRate,0);

    // Total sales MAD
    const totalSalesMAD=sales.reduce((s,v)=>s+v.qty*v.sellingPrice,0);

    // Total profit
    const totalProfit=sales.reduce((s,v)=>{
      const cost=avgCostMap[v.productId]||0;
      return s+(v.sellingPrice-cost)*v.qty;
    },0);

    // Stock value
    const stockValue=products.reduce((s,p)=>s+(stockMap[p.id]||0)*(avgCostMap[p.id]||0),0);

    // Supplier debts
    const supplierDebt={};
    suppliers.forEach(f=>supplierDebt[f.id]=0);
    purchases.forEach(a=>{if(supplierDebt[a.supplierId]!==undefined)supplierDebt[a.supplierId]+=a.qty*a.unitPriceFranc*a.exchangeRate;});
    supplierPayments.forEach(p=>{if(supplierDebt[p.supplierId]!==undefined)if(p.direction==='out'||!p.direction)supplierDebt[p.supplierId]-=p.amount;
        else supplierDebt[p.supplierId]+=p.amount;});
    const totalDebt=Object.values(supplierDebt).reduce((s,v)=>s+Math.max(0,v),0);

    // Monthly data for charts (last 6 months)
    const now=new Date();
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({label:d.toLocaleDateString('fr-MA',{month:'short',year:'2-digit'}),
        key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`});
    }
    const monthlySales=months.map(m=>sales.filter(v=>v.date.startsWith(m.key)).reduce((s,v)=>s+v.qty*v.sellingPrice,0));
    const monthlyProfit=months.map(m=>sales.filter(v=>v.date.startsWith(m.key)).reduce((s,v)=>s+(v.sellingPrice-(avgCostMap[v.productId]||0))*v.qty,0));

    return{stockMap,purchasedQty,soldQty,avgCostMap,totalPurchasesMAD,totalSalesMAD,
      totalProfit,stockValue,supplierDebt,totalDebt,months,monthlySales,monthlyProfit};
  },[data]);
}

// ─── Dashboard Charts ─────────────────────────────────────────────────────────
function SalesChart({months,monthlySales,monthlyProfit}){
  const ref=useRef();const cref=useRef();
  useEffect(()=>{
    if(cref.current)cref.current.destroy();
    const ctx=ref.current.getContext('2d');
    cref.current=new Chart(ctx,{
      type:'bar',
      data:{labels:months.map(m=>m.label),datasets:[
        {label:'Ventes (MAD)',data:monthlySales,backgroundColor:'rgba(13,148,136,0.85)',borderRadius:6,borderSkipped:false},
        {label:'Bénéfice (MAD)',data:monthlyProfit,backgroundColor:'rgba(16,185,129,0.6)',borderRadius:6,borderSkipped:false},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:10}}},
        scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10},callback:v=>v>=1000?Math.round(v/1000)+'k':v}},
          x:{grid:{display:false},ticks:{font:{size:11}}}}},
    });
    return()=>{if(cref.current)cref.current.destroy();};
  },[months,monthlySales,monthlyProfit]);
  return<div className="chart-container"><canvas ref={ref}/></div>;
}

  const openEdit=p=>{setForm({name:p.name,category:p.category,sellingPrice:p.sellingPrice});setEditId(p.id);setModal('form');};
  const save=()=>{
    if(!form.name||!form.sellingPrice)return;
    update(d=>{
      const prods=editId?d.products.map(p=>p.id===editId?{...p,...form,sellingPrice:Number(form.sellingPrice)}:p)
        :[...d.products,{id:'P'+uid(),name:form.name,category:form.category,sellingPrice:Number(form.sellingPrice),createdAt:today()}];
      return{...d,products:prods};
    });
    setModal(null);
  };
  const del=id=>{
    if(!confirm('Supprimer ce produit?'))return;
    update(d=>({...d,products:d.products.filter(p=>p.id!==id)}));
  };
  return(
    <div>
      <div className="section-header">
        <SearchInput value={q} onChange={setQ} placeholder="Rechercher un produit..."/>
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/>Ajouter</button>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Produit</th><th>Catégorie</th><th>Prix Vente</th><th>Stock</th><th>Coût Moyen</th><th>Actions</th></tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={6}><div className="empty-state"><div className="empty-icon">📦</div>Aucun produit trouvé</div></td></tr>}
              {filtered.map(p=>(
                <tr key={p.id}>
                  <td><div style={{fontWeight:500}}>{p.name}</div><div style={{fontSize:11,color:'#94A3B8'}}>{p.id}</div></td>
                  <td><span className="tag">{p.category}</span></td>
                  <td><span style={{fontWeight:600,color:'#0D9488'}}>{fmtMAD(p.sellingPrice)}</span></td>
                  <td>
                    <span className={clsx('badge',calcs.stockMap[p.id]>10?'badge-green':calcs.stockMap[p.id]>0?'badge-yellow':'badge-red')}>
                      {calcs.stockMap[p.id]||0} unités
                    </span>
                  </td>
                  <td>{fmtMAD(calcs.avgCostMap[p.id]||0)}</td>
                  <td>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(p)}><Icon name="edit" size={13}/>Edit</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>del(p.id)}><Icon name="trash" size={13}/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <Modal title={editId?'Modifier le produit':'Nouveau produit'} open={modal==='form'} onClose={()=>setModal(null)}>
        <div className="form-group"><label className="label">Nom du produit</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Ex: Smartphone Galaxy A15"/></div>
        <div className="form-group"><label className="label">Catégorie</label><select className="select" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>{cats.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="form-group"><label className="label">Prix de vente (MAD)</label><input className="input" type="number" value={form.sellingPrice} onChange={e=>setForm({...form,sellingPrice:e.target.value})} placeholder="0.00"/></div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:4}}>
          <button className="btn btn-ghost" onClick={()=>setModal(null)}>Annuler</button>
          <button className="btn btn-primary" onClick={save}><Icon name="check" size={14}/>Enregistrer</button>
        </div>
      </Modal>
    </div>
  );
}

// ─── Suppliers ────────────────────────────────────────────────────────────────
function Suppliers({data,update,calcs}){
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({name:'',phone:'',city:'',notes:''});
  const[editId,setEditId]=useState(null);
  const[payModal,setPayModal]=useState(null);
  const[payForm,setPayForm]=useState({amount:'',date:today(),notes:'',direction:'out',method:'Virement'});
  const[histModal,setHistModal]=useState(null);
  const METHODS=['Virement','Espèces','Chèque','PayPal','Western Union','Avoir','Remboursement','Autre'];
  const openAdd=()=>{setForm({name:'',phone:'',city:'',notes:''});setEditId(null);setModal('form');};
  const openEdit=s=>{setForm({name:s.name,phone:s.phone,city:s.city,notes:s.notes||''});setEditId(s.id);setModal('form');};
  const save=()=>{
    if(!form.name)return;
    update(d=>{
      const sups=editId?d.suppliers.map(s=>s.id===editId?{...s,...form}:s)
        :[...d.suppliers,{id:'F'+uid(),...form}];
      return{...d,suppliers:sups};
    });setModal(null);
  };
  const addPayment=()=>{
    if(!payForm.amount||!payModal)return;
    update(d=>({...d,supplierPayments:[...d.supplierPayments,{
      id:'PAY'+uid(),supplierId:payModal,amount:Number(payForm.amount),
      direction:payForm.direction,method:payForm.method,
      date:payForm.date,notes:payForm.notes,createdAt:today()
    }]}));
    setPayModal(null);setPayForm({amount:'',date:today(),notes:'',direction:'out',method:'Virement'});
  };
  const delPayment=id=>{
    if(!confirm('Supprimer ce mouvement?'))return;
    update(d=>({...d,supplierPayments:d.supplierPayments.filter(p=>p.id!==id)}));
  };
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
        {[
          {label:'Dette totale fournisseurs',value:fmtMAD(calcs.totalDebt),color:'#EF4444'},
          {label:'Total payé aux fournisseurs',value:fmtMAD(calcs.totalPaidOut),color:'#3B82F6'},
          {label:'Total reçu des fournisseurs',value:fmtMAD(calcs.totalReceived),color:'#10B981'},
        ].map((k,i)=>(
          <div key={i} className="kpi-card" style={{padding:'14px 16px'}}>
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value" style={{color:k.color,fontSize:20}}>{k.value}</div>
          </div>
        ))}
      </div>
      <div className="section-header">
        <h3 className="section-title">Fournisseurs ({data.suppliers.length})</h3>
        <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/>Ajouter</button>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Fournisseur</th><th>Contact</th><th>Total Achats</th><th>Payé ↗</th><th>Reçu ↙</th><th>Solde Net</th><th>Actions</th></tr></thead>
            <tbody>
              {data.suppliers.length===0&&<tr><td colSpan={7}><div className="empty-state">Aucun fournisseur</div></td></tr>}
              {data.suppliers.map(s=>{
                const totalAchats=data.purchases.filter(a=>a.supplierId===s.id).reduce((sum,a)=>sum+a.qty*a.unitPriceFranc*a.exchangeRate,0);
                const paysOut=data.supplierPayments.filter(p=>p.supplierId===s.id&&p.direction==='out').reduce((sum,p)=>sum+p.amount,0);
                const paysIn=data.supplierPayments.filter(p=>p.supplierId===s.id&&p.direction==='in').reduce((sum,p)=>sum+p.amount,0);
                const balance=totalAchats-paysOut+paysIn;
                return(
                  <tr key={s.id}>
                    <td><div style={{fontWeight:500}}>{s.name}</div><div style={{fontSize:11,color:'#94A3B8'}}>{s.city}</div></td>
                    <td style={{fontSize:13,color:'#64748B'}}>{s.phone}</td>
                    <td style={{fontWeight:500}}>{fmtMAD(totalAchats)}</td>
                    <td style={{color:'#3B82F6',fontWeight:500}}>{fmtMAD(paysOut)}</td>
                    <td style={{color:'#10B981',fontWeight:500}}>{fmtMAD(paysIn)}</td>
                    <td><span className={clsx('badge',balance<=0?'badge-green':balance<totalAchats*0.5?'badge-yellow':'badge-red')}>{fmtMAD(Math.max(0,balance))}</span></td>
                    <td>
                      <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                        <button className="btn btn-ghost btn-sm" onClick={()=>{setPayModal(s.id);setPayForm({amount:'',date:today(),notes:'',direction:'out',method:'Virement'});}} style={{color:'#3B82F6',borderColor:'#BFDBFE',fontSize:12}}>↗ Payer</button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>{setPayModal(s.id);setPayForm({amount:'',date:today(),notes:'',direction:'in',method:'Remboursement'});}} style={{color:'#10B981',borderColor:'#BBF7D0',fontSize:12}}>↙ Reçu</button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>setHistModal(s.id)} title="Historique" style={{fontSize:12}}>📋</button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(s)}><Icon name="edit" size={12}/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <Modal title={editId?'Modifier fournisseur':'Nouveau fournisseur'} open={modal==='form'} onClose={()=>setModal(null)}>
        <div className="form-group"><label className="label">Nom</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Nom du fournisseur"/></div>
        <div className="two-col">
          <div className="form-group"><label className="label">Téléphone</label><input className="input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+212..."/></div>
          <div className="form-group"><label className="label">Ville</label><input className="input" value={form.city} onChange={e=>setForm({...form,city:e.target.value})} placeholder="Casablanca"/></div>
        </div>
        <div className="form-group"><label className="label">Notes</label><input className="input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Produits, conditions..."/></div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={()=>setModal(null)}>Annuler</button>
          <button className="btn btn-primary" onClick={save}><Icon name="check" size={14}/>Enregistrer</button>
        </div>
      </Modal>

      <Modal title="Enregistrer un mouvement financier" open={!!payModal} onClose={()=>setPayModal(null)}>
        {payModal&&<div>
          <div style={{background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:13}}>
            <strong>Fournisseur :</strong> {data.suppliers.find(s=>s.id===payModal)?.name}<br/>
            <span style={{color:'#64748B'}}>Solde actuel : </span>
            <span style={{fontWeight:600,color:Math.max(0,calcs.supplierDebt[payModal]||0)>0?'#EF4444':'#10B981'}}>
              {fmtMAD(Math.max(0,calcs.supplierDebt[payModal]||0))}
            </span>
          </div>
          <div className="form-group">
            <label className="label">Type de mouvement</label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:4}}>
              <button type="button" onClick={()=>setPayForm({...payForm,direction:'out',method:'Virement'})}
                style={{padding:'12px 8px',borderRadius:8,border:`2px solid ${payForm.direction==='out'?'#3B82F6':'#E2E8F0'}`,
                  background:payForm.direction==='out'?'#EFF6FF':'#fff',cursor:'pointer',fontSize:13,fontWeight:500,
                  color:payForm.direction==='out'?'#1D4ED8':'#64748B',transition:'all 0.15s'}}>
                <div style={{fontSize:20,marginBottom:4}}>↗</div>
                <div>Je paye le fournisseur</div>
                <div style={{fontSize:11,opacity:0.7,marginTop:2}}>Virement, espèces...</div>
              </button>
              <button type="button" onClick={()=>setPayForm({...payForm,direction:'in',method:'Remboursement'})}
                style={{padding:'12px 8px',borderRadius:8,border:`2px solid ${payForm.direction==='in'?'#10B981':'#E2E8F0'}`,
                  background:payForm.direction==='in'?'#F0FDF4':'#fff',cursor:'pointer',fontSize:13,fontWeight:500,
                  color:payForm.direction==='in'?'#15803D':'#64748B',transition:'all 0.15s'}}>
                <div style={{fontSize:20,marginBottom:4}}>↙</div>
                <div>Je reçois du fournisseur</div>
                <div style={{fontSize:11,opacity:0.7,marginTop:2}}>Remboursement, avoir...</div>
              </button>
            </div>
          </div>
          <div className="two-col">
            <div className="form-group">
              <label className="label">Montant (MAD)</label>
              <input className="input" type="number" value={payForm.amount} onChange={e=>setPayForm({...payForm,amount:e.target.value})} placeholder="0.00"/>
            </div>
            <div className="form-group">
              <label className="label">Méthode</label>
              <select className="select" value={payForm.method} onChange={e=>setPayForm({...payForm,method:e.target.value})}>
                {METHODS.map(m=><option key={m}>{m}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group"><label className="label">Date</label><input className="input" type="date" value={payForm.date} onChange={e=>setPayForm({...payForm,date:e.target.value})}/></div>
          <div className="form-group"><label className="label">Référence / Notes</label><input className="input" value={payForm.notes} onChange={e=>setPayForm({...payForm,notes:e.target.value})} placeholder="Numéro virement, avoir, ref remboursement..."/></div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={()=>setPayModal(null)}>Annuler</button>
            <button className="btn btn-primary" style={{background:payForm.direction==='in'?'#10B981':'#0D9488'}} onClick={addPayment}>
              <Icon name="check" size={14}/>{payForm.direction==='in'?'Enregistrer réception':'Confirmer paiement'}
            </button>
          </div>
        </div>}
      </Modal>

      <Modal title="Historique des mouvements" open={!!histModal} onClose={()=>setHistModal(null)}>
        {histModal&&<div>
          <div style={{fontWeight:600,marginBottom:12,fontSize:14}}>{data.suppliers.find(s=>s.id===histModal)?.name}</div>
          {data.supplierPayments.filter(p=>p.supplierId===histModal).length===0
            ?<div className="empty-state" style={{padding:'20px'}}>Aucun mouvement enregistré</div>
            :[...data.supplierPayments.filter(p=>p.supplierId===histModal)].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>(
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #F1F5F9'}}>
                <div style={{width:34,height:34,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,
                  background:p.direction==='in'?'#F0FDF4':'#EFF6FF',flexShrink:0,fontWeight:700,
                  color:p.direction==='in'?'#15803D':'#1D4ED8'}}>
                  {p.direction==='in'?'↙':'↗'}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,color:p.direction==='in'?'#15803D':'#1D4ED8'}}>
                    {p.direction==='in'?'Reçu du fournisseur':'Payé au fournisseur'}
                  </div>
                  <div style={{fontSize:11,color:'#94A3B8'}}>{p.date} · {p.method}{p.notes?' · '+p.notes:''}</div>
                </div>
                <div style={{fontWeight:700,fontSize:14,color:p.direction==='in'?'#15803D':'#1D4ED8',flexShrink:0,marginRight:8}}>
                  {p.direction==='in'?'+':'-'}{fmtMAD(p.amount)}
                </div>
                <button className="btn btn-danger btn-sm" style={{padding:'4px 8px'}} onClick={()=>delPayment(p.id)}><Icon name="trash" size={12}/></button>
              </div>
            ))
          }
          <div style={{marginTop:14,padding:'12px 14px',background:'#F8FAFC',borderRadius:8,fontSize:13,border:'1px solid #E2E8F0'}}>
            {(()=>{
              const ps=data.supplierPayments.filter(p=>p.supplierId===histModal);
              const out=ps.filter(p=>p.direction==='out').reduce((s,p)=>s+p.amount,0);
              const inn=ps.filter(p=>p.direction==='in').reduce((s,p)=>s+p.amount,0);
              const totalAchats=data.purchases.filter(a=>a.supplierId===histModal).reduce((sum,a)=>sum+a.qty*a.unitPriceFranc*a.exchangeRate,0);
              const solde=totalAchats-out+inn;
              return<>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span style={{color:'#64748B'}}>Total achats</span>
                  <span style={{fontWeight:600}}>{fmtMAD(totalAchats)}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span style={{color:'#3B82F6'}}>↗ Total payé</span>
                  <span style={{color:'#3B82F6',fontWeight:600}}>{fmtMAD(out)}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                  <span style={{color:'#10B981'}}>↙ Total reçu</span>
                  <span style={{color:'#10B981',fontWeight:600}}>{fmtMAD(inn)}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',borderTop:'1px solid #E2E8F0',paddingTop:8}}>
                  <span style={{fontWeight:600}}>Solde net dû</span>
                  <span style={{fontWeight:700,fontSize:16,color:solde>0?'#EF4444':'#10B981'}}>{fmtMAD(Math.max(0,solde))}</span>
                </div>
              </>;
            })()}
          </div>
        </div>}
      </Modal>
    </div>
  );
}

// ─── Purchases ────────────────────────────────────────────────────────────────
function Purchases({data,update,calcs}){
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({date:today(),supplierId:'',productId:'',qty:'',unitPriceFranc:'',exchangeRate:'1.90'});
  const totalFranc=Number(form.qty||0)*Number(form.unitPriceFranc||0);
  const totalMAD=totalFranc*Number(form.exchangeRate||0);
  const save=()=>{
    if(!form.supplierId||!form.productId||!form.qty||!form.unitPriceFranc)return;
    update(d=>({...d,purchases:[...d.purchases,{id:'ACH'+uid(),date:form.date,supplierId:form.supplierId,
      productId:form.productId,qty:Number(form.qty),unitPriceFranc:Number(form.unitPriceFranc),
      exchangeRate:Number(form.exchangeRate),createdAt:today()}]}));
    setModal(false);setForm({date:today(),supplierId:'',productId:'',qty:'',unitPriceFranc:'',exchangeRate:'1.90'});
  };
  const del=id=>{if(!confirm('Supprimer?'))return;update(d=>({...d,purchases:d.purchases.filter(a=>a.id!==id)}));};
  const sorted=[...data.purchases].sort((a,b)=>b.date.localeCompare(a.date));
  return(
    <div>
      <div className="section-header">
        <h3 className="section-title">Achats ({data.purchases.length})</h3>
        <button className="btn btn-primary" onClick={()=>setModal(true)}><Icon name="plus" size={14}/>Nouvel achat</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
        {[
          {label:'Total achats (MAD)',value:fmtMAD(calcs.totalPurchasesMAD),color:'#3B82F6'},
          {label:'Nombre d\'achats',value:data.purchases.length,color:'#8B5CF6'},
          {label:'Fournisseurs actifs',value:new Set(data.purchases.map(a=>a.supplierId)).size,color:'#0D9488'},
        ].map((k,i)=>(
          <div key={i} className="kpi-card" style={{padding:'14px 16px'}}>
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value" style={{color:k.color,fontSize:20}}>{k.value}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Fournisseur</th><th>Produit</th><th>Qté</th><th>Prix/U (F)</th><th>Total (F)</th><th>Taux</th><th>Total (MAD)</th><th></th></tr></thead>
            <tbody>
              {sorted.length===0&&<tr><td colSpan={9}><div className="empty-state">Aucun achat enregistré</div></td></tr>}
              {sorted.map(a=>{
                const sup=data.suppliers.find(s=>s.id===a.supplierId);
                const prod=data.products.find(p=>p.id===a.productId);
                const tf=a.qty*a.unitPriceFranc;const tm=tf*a.exchangeRate;
                return(
                  <tr key={a.id}>
                    <td style={{fontSize:12,color:'#64748B'}}>{a.date}</td>
                    <td><div style={{fontWeight:500,fontSize:13}}>{sup?.name||'—'}</div></td>
                    <td style={{fontSize:13}}>{prod?.name||'—'}</td>
                    <td style={{textAlign:'center',fontWeight:600}}>{a.qty}</td>
                    <td>{fmtFranc(a.unitPriceFranc)}</td>
                    <td>{fmtFranc(tf)}</td>
                    <td><span className="rate-badge">×{a.exchangeRate}</span></td>
                    <td><span style={{fontWeight:600,color:'#0D9488'}}>{fmtMAD(tm)}</span></td>
                    <td><button className="btn btn-danger btn-sm" onClick={()=>del(a.id)}><Icon name="trash" size={12}/></button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      <Modal title="Nouvel achat" open={modal} onClose={()=>setModal(false)}>
        <div className="form-group"><label className="label">Date</label><input className="input" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
        <div className="two-col">
          <div className="form-group"><label className="label">Fournisseur</label>
            <select className="select" value={form.supplierId} onChange={e=>setForm({...form,supplierId:e.target.value})}>
              <option value="">Sélectionner...</option>
              {data.suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">Produit</label>
            <select className="select" value={form.productId} onChange={e=>setForm({...form,productId:e.target.value})}>
              <option value="">Sélectionner...</option>
              {data.products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
        <div className="two-col">
          <div className="form-group"><label className="label">Quantité</label><input className="input" type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="0"/></div>
          <div className="form-group"><label className="label">Prix unitaire (Franc)</label><input className="input" type="number" value={form.unitPriceFranc} onChange={e=>setForm({...form,unitPriceFranc:e.target.value})} placeholder="0.00"/></div>
        </div>
        <div className="form-group"><label className="label">Taux de change (Franc → MAD)</label><input className="input" type="number" step="0.01" value={form.exchangeRate} onChange={e=>setForm({...form,exchangeRate:e.target.value})} placeholder="1.90"/></div>
        {form.qty&&form.unitPriceFranc&&(

}

// ─── Stock ────────────────────────────────────────────────────────────────────
function Stock({data,calcs}){
  const[q,setQ]=useState('');
  const LOW=5;
  const items=data.products.map(p=>({
    ...p,stock:calcs.stockMap[p.id]||0,
    bought:calcs.purchasedQty[p.id]||0,
    sold:calcs.soldQty[p.id]||0,
    avgCost:calcs.avgCostMap[p.id]||0,
    value:(calcs.stockMap[p.id]||0)*(calcs.avgCostMap[p.id]||0),
  })).filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
  const lowStock=items.filter(i=>i.stock>0&&i.stock<=LOW);
  const outOfStock=items.filter(i=>i.stock<=0);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
        {[
          {label:'Valeur totale stock',value:fmtMAD(calcs.stockValue),color:'#8B5CF6'},
          {label:'Total produits',value:data.products.length,color:'#0D9488'},
          {label:'Alertes stock faible',value:lowStock.length,color:'#F59E0B'},
          {label:'Ruptures de stock',value:outOfStock.length,color:'#EF4444'},
        ].map((k,i)=>(
          <div key={i} className="kpi-card" style={{padding:'14px 16px'}}>
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value" style={{color:k.color,fontSize:20}}>{k.value}</div>
          </div>
        ))}
      </div>
      {(lowStock.length>0||outOfStock.length>0)&&(
        <div style={{marginBottom:16,display:'flex',flexDirection:'column',gap:8}}>
          {outOfStock.map(i=>(
            <div key={i.id} className="alert alert-red"><Icon name="alert" size={14}/><strong>{i.name}</strong> — RUPTURE DE STOCK</div>
          ))}
          {lowStock.map(i=>(
            <div key={i.id} className="alert alert-yellow"><Icon name="alert" size={14}/><strong>{i.name}</strong> — Stock faible: {i.stock} unités restantes</div>
          ))}
        </div>
      )}
      <div className="section-header">
        <SearchInput value={q} onChange={setQ} placeholder="Rechercher un produit..."/>
      </div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Produit</th><th>Acheté</th><th>Vendu</th><th>Stock Actuel</th><th>Coût Moyen</th><th>Valeur Stock</th><th>Statut</th></tr></thead>
            <tbody>
              {items.map(i=>(
                <tr key={i.id}>
                  <td><div style={{fontWeight:500}}>{i.name}</div><span className="tag">{i.category}</span></td>
                  <td style={{textAlign:'center'}}>{i.bought}</td>
                  <td style={{textAlign:'center'}}>{i.sold}</td>
                  <td>
                    <div style={{textAlign:'center',fontWeight:700,fontSize:16,color:i.stock<=0?'#EF4444':i.stock<=LOW?'#F59E0B':'#0D9488'}}>{i.stock}</div>
                    {i.bought>0&&<div className="progress" style={{marginTop:4}}>
                      <div className="progress-bar" style={{width:`${Math.min(100,i.stock/Math.max(i.bought,1)*100)}%`,background:i.stock<=0?'#EF4444':i.stock<=LOW?'#F59E0B':'#0D9488'}}/>
                    </div>}
                  </td>
                  <td>{fmtMAD(i.avgCost)}</td>
                  <td style={{fontWeight:600}}>{fmtMAD(i.value)}</td>
                  <td>{i.stock<=0?<span className="badge badge-red">Rupture</span>:i.stock<=LOW?<span className="badge badge-yellow">Faible</span>:<span className="badge badge-green">OK</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── Finance ──────────────────────────────────────────────────────────────────

  const summaries=[
    {label:'Chiffre d\'affaires',value:calcs.totalSalesMAD,color:'#0D9488',icon:'trendingup',desc:'Total des ventes (MAD)'},
    {label:'Coût des achats',value:calcs.totalPurchasesMAD,color:'#3B82F6',icon:'shoppingcart',desc:'Total achats en MAD'},
    {label:'Bénéfice brut',value:calcs.totalProfit,color:'#10B981',icon:'dollar',desc:`Marge ${fmt(margin,1)}%`},

            <div style={{width:44,height:44,borderRadius:10,background:'#F8FAFC',border:'1px solid #E2E8F0',display:'flex',alignItems:'center',justifyContent:'center',color:s.color,flexShrink:0}}>
              <Icon name={s.icon} size={20}/>
            </div>
            <div>
              <div style={{fontSize:12,color:'#64748B',fontWeight:500,marginBottom:4}}>{s.label}</div>
              <div style={{fontSize:22,fontFamily:'Outfit',fontWeight:700,color:s.color}}>
                {s.extra||fmtMAD(s.value)}
              </div>
              <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{s.desc}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="two-col">
        <div className="card">
          <h3 className="section-title" style={{marginBottom:14}}>Dernières ventes</h3>
          {[...data.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(v=>{
            const p=data.products.find(pr=>pr.id===v.productId);
            const profit=(v.sellingPrice-(calcs.avgCostMap[v.productId]||0))*v.qty;
            return(
              <div key={v.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid #F1F5F9'}}>
                <div><div style={{fontSize:13,fontWeight:500}}>{p?.name||'—'}</div><div style={{fontSize:11,color:'#94A3B8'}}>{v.date} · Qté {v.qty}</div></div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:13,fontWeight:600,color:'#0D9488'}}>{fmtMAD(v.qty*v.sellingPrice)}</div>
                  <div style={{fontSize:11,color:profit>=0?'#10B981':'#EF4444'}}>Profit: {fmtMAD(profit)}</div>
                </div>
              </div>
            );
          })}
        </div>
        <div className="card">
          <h3 className="section-title" style={{marginBottom:14}}>Derniers achats</h3>
          {[...data.purchases].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(a=>{
            const s=data.suppliers.find(f=>f.id===a.supplierId);
            const p=data.products.find(pr=>pr.id===a.productId);
            const total=a.qty*a.unitPriceFranc*a.exchangeRate;
            return(
              <div key={a.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid #F1F5F9'}}>
                <div><div style={{fontSize:13,fontWeight:500}}>{p?.name||'—'}</div><div style={{fontSize:11,color:'#94A3B8'}}>{a.date} · {s?.name||'—'}</div></div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:13,fontWeight:600,color:'#3B82F6'}}>{fmtMAD(total)}</div>
                  <div style={{fontSize:11,color:'#94A3B8'}}>{fmtFranc(a.qty*a.unitPriceFranc)}</div>

            );
          })}
        </div>
      </div>
    </div>
  );
}
