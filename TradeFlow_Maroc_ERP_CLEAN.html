              {[
                {key:'current',label:'Mot de passe actuel',ph:'••••••••'},
                {key:'next',label:'Nouveau mot de passe',ph:'Minimum 6 caractères'},
                {key:'confirm',label:'Confirmer le nouveau mot de passe',ph:'Répéter le mot de passe'},
              ].map(({key,label,ph})=>(
                <div key={key} className="form-group">
                  <label className="label">{label}</label>
                  <div style={{position:'relative'}}>
                    <input className="input" type={pwVisible[key]?'text':'password'}
                      value={pwForm[key]} onChange={e=>setPwForm({...pwForm,[key]:e.target.value})}
                      placeholder={ph} style={{paddingRight:40}}/>
                    <button type="button" onClick={()=>setPwVisible({...pwVisible,[key]:!pwVisible[key]})}
                      style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'#94A3B8',padding:2}}>
                      <Icon name={pwVisible[key]?'eyeoff':'eye'} size={15}/>
                    </button>
                  </div>
                </div>
              ))}
              <button className="btn btn-primary" onClick={changePassword}>
                <Icon name="key" size={14}/>Modifier le mot de passe
              </button>
            </div>

            <div className="card">
              <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:14}}>
                Session
              </div>
              <div className="form-group">
                <label className="label">Déconnexion automatique après (minutes)</label>
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                  <input type="range" min="15" max="480" step="15" value={settings.autoLogoutMinutes}
                    onChange={e=>setSettings({...settings,autoLogoutMinutes:Number(e.target.value)})}
                    style={{flex:1}}/>
                  <span style={{minWidth:70,fontSize:14,fontWeight:600,color:'#0D9488',textAlign:'right'}}>
                    {settings.autoLogoutMinutes >= 60
                      ? Math.floor(settings.autoLogoutMinutes/60)+'h'+(settings.autoLogoutMinutes%60?String(settings.autoLogoutMinutes%60).padStart(2,'0')+'min':'')
                      : settings.autoLogoutMinutes+' min'}
                  </span>
                </div>
              </div>
              <button className="btn btn-primary" onClick={saveSettings}>
                <Icon name="check" size={14}/>Enregistrer
              </button>
            </div>
          </div>
        )}

        {/* ── SETTINGS ── */}
        {section==='settings'&&(
          <div style={{maxWidth:560}}>
            <div className="card" style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:14}}>
                Devise & Conversion
              </div>
              <div className="two-col">
                <div className="form-group">
                  <label className="label">Taux de change par défaut (Franc → MAD)</label>
                  <div style={{position:'relative'}}>
                    <input className="input" type="number" step="0.01" min="0.01"
                      value={settings.exchangeRate}
                      onChange={e=>setSettings({...settings,exchangeRate:Number(e.target.value)})}
                      style={{paddingRight:50}}/>
                    <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',fontSize:11,color:'#94A3B8',fontWeight:600}}>MAD</span>
                  </div>
                  <div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>
                    1 Franc = {settings.exchangeRate} MAD
                  </div>
                </div>
                <div className="form-group">
                  <label className="label">Devise d'affichage</label>
                  <select className="select" value={settings.currency} onChange={e=>setSettings({...settings,currency:e.target.value})}>
                    {['MAD','EUR','USD','GBP'].map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
              </div>
            </div>

            <div className="card" style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:14}}>
                Stock & Facturation
              </div>
              <div className="two-col">
                <div className="form-group">
                  <label className="label">Seuil alerte stock faible</label>
                  <div style={{position:'relative'}}>
                    <input className="input" type="number" min="1" max="100"
                      value={settings.lowStockThreshold}
                      onChange={e=>setSettings({...settings,lowStockThreshold:Number(e.target.value)})}
                      style={{paddingRight:70}}/>
                    <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',fontSize:11,color:'#94A3B8',fontWeight:600}}>unités</span>
                  </div>
                  <div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>
                    Alerte si stock ≤ {settings.lowStockThreshold} unités
                  </div>
                </div>
                <div className="form-group">
                  <label className="label">TVA par défaut (%)</label>
                  <div style={{position:'relative'}}>
                    <input className="input" type="number" min="0" max="100" step="0.1"
                      value={settings.tvaRate}
                      onChange={e=>setSettings({...settings,tvaRate:Number(e.target.value)})}
                      style={{paddingRight:30}}/>
                    <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'#94A3B8',fontWeight:600}}>%</span>
                  </div>
                </div>
              </div>
            </div>

            <div style={{display:'flex',justifyContent:'flex-end'}}>
              <button className="btn btn-primary" style={{padding:'10px 24px'}} onClick={saveSettings}>
                <Icon name="check" size={14}/>Enregistrer les paramètres
              </button>
            </div>
          </div>
        )}

        {/* ── DATA ── */}
        {section==='data'&&(
          <div style={{display:'flex',flexDirection:'column',gap:14,maxWidth:560}}>
            {/* Storage gauge */}
            <div className="card">
              <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:12}}>
                Stockage utilisé
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                <span style={{fontSize:13,color:'#475569'}}>{storageSizeKB} Ko utilisés</span>
                <span style={{fontSize:13,color:'#94A3B8'}}>5 120 Ko max (localStorage)</span>
              </div>
              <div style={{height:10,background:'#F1F5F9',borderRadius:5,overflow:'hidden'}}>
                <div style={{height:'100%',width:storagePercent+'%',
                  background:storagePercent>80?'#EF4444':storagePercent>50?'#F59E0B':'#0D9488',
                  borderRadius:5,transition:'width 0.5s'}}/>
              </div>
              <div style={{fontSize:11,color:'#94A3B8',marginTop:6}}>{storagePercent.toFixed(1)}% utilisé</div>
            </div>

            {/* Export / Import */}
            <div className="card">
              <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:12}}>
                Sauvegarde
              </div>
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                <button className="btn btn-primary" onClick={exportData}>
                  <Icon name="download" size={14}/>Exporter toutes les données
                </button>
                <button className="btn btn-ghost" onClick={importData}>
                  <Icon name="upload" size={14}/>Importer un backup
                </button>
              </div>
              <div style={{fontSize:11,color:'#94A3B8',marginTop:10,lineHeight:1.6}}>
                L'export crée un fichier <code style={{background:'#F1F5F9',padding:'1px 4px',borderRadius:3}}>tradeflow_backup_YYYY-MM-DD.json</code> contenant toutes vos données. Conservez ce fichier en lieu sûr.
              </div>
            </div>

            {/* Danger zone */}
            <div className="card" style={{border:'1px solid #FECACA'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#B91C1C',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:12}}>
                ⚠️ Zone de danger
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 14px',background:'#FFF7ED',borderRadius:8,border:'1px solid #FED7AA'}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600,color:'#92400E'}}>Réinitialiser aux données de démo</div>
                    <div style={{fontSize:11,color:'#B45309',marginTop:2}}>Recharge les données d'exemple initiales</div>
                  </div>
                  <button className="btn" style={{background:'#FEF3C7',color:'#92400E',border:'1px solid #FDE68A',fontSize:12}} onClick={resetDemo}>
                    Réinitialiser
                  </button>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 14px',background:'#FEF2F2',borderRadius:8,border:'1px solid #FECACA'}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600,color:'#B91C1C'}}>Supprimer toutes les données</div>
                    <div style={{fontSize:11,color:'#DC2626',marginTop:2}}>Irréversible — efface tout définitivement</div>
                  </div>
                  <button className="btn btn-danger btn-sm" onClick={clearAll}>
                    <Icon name="trash" size={13}/>Tout effacer
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── STATS ── */}
        {section==='stats'&&(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12,marginBottom:20}}>
              {moduleStats.map((m,i)=>(
                <div key={i} className="card" style={{padding:'14px 16px',borderLeft:`3px solid ${m.color}`}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                    <Icon name={m.icon} size={14} style={{color:m.color}}/>
                    <span style={{fontSize:11,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.4px'}}>{m.label}</span>
                  </div>
                  <div style={{fontFamily:'Outfit',fontSize:28,fontWeight:700,color:m.color}}>{m.count}</div>
                </div>
              ))}
            </div>

            <div className="two-col">
              <div className="card">
                <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:12}}>
                  Informations système
                </div>
                {[
                  ['Version ERP','TradeFlow Maroc v1.0'],
                  ['Stockage','localStorage (navigateur)'],
                  ['Taille des données',storageSizeKB+' Ko / 5 120 Ko'],
                  ['Taux de change actuel','1 F = '+(data.settings?.exchangeRate||1.90)+' MAD'],
                  ['Seuil stock faible','≤ '+(data.settings?.lowStockThreshold||5)+' unités'],
                  ['TVA par défaut',(data.settings?.tvaRate||20)+'%'],
                  ['Première utilisation',data.settings?.createdAt||'—'],
                  ['Dernière export','—'],
                ].map(([k,v],i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #F1F5F9',fontSize:13}}>
                    <span style={{color:'#64748B'}}>{k}</span>
                    <span style={{fontWeight:500,color:'#0F172A'}}>{v}</span>
                  </div>
                ))}
              </div>

              <div className="card">
                <div style={{fontSize:13,fontWeight:600,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:12}}>
                  Résumé financier global
                </div>
                {[
                  ['Ventes totales',fmtMAD(calcs.totalSalesMAD),'#0D9488'],
                  ['Achats totaux',fmtMAD(calcs.totalPurchasesMAD),'#3B82F6'],
                  ['Bénéfice net',fmtMAD(calcs.totalProfit),'#10B981'],
                  ['Valeur du stock',fmtMAD(calcs.stockValue),'#8B5CF6'],
                  ['Dette fournisseurs',fmtMAD(calcs.totalDebt),'#EF4444'],
                  ['Masse salariale',(()=>{const total=(data.salaryPayments||[]).reduce((s,p)=>s+p.total,0);return fmtMAD(total);})(),'#F59E0B'],
                ].map(([k,v,color],i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #F1F5F9',fontSize:13}}>
                    <span style={{color:'#64748B'}}>{k}</span>
                    <span style={{fontWeight:700,color}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Clients Page ─────────────────────────────────────────────────────────────
function Clients({data,update,calcs}){
  const[q,setQ]=useState('');
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({name:'',phone:'',city:'',address:'',email:'',notes:''});
  const[editId,setEditId]=useState(null);
  const[selected,setSelected]=useState(null);

  const openAdd=()=>{setForm({name:'',phone:'',city:'',address:'',email:'',notes:''});setEditId(null);setModal(true);};
  const openEdit=c=>{setForm({name:c.name,phone:c.phone,city:c.city,address:c.address||'',email:c.email||'',notes:c.notes||''});setEditId(c.id);setModal(true);};
  const save=()=>{
    if(!form.name.trim())return;
    update(d=>{
      const list=editId
        ?d.clients.map(c=>c.id===editId?{...c,...form}:c)
        :[...(d.clients||[]),{id:'CLI'+uid(),...form,createdAt:today()}];
      return{...d,clients:list};
    });
    setModal(false);
  };
  const del=id=>{
    if(!confirm('Supprimer ce client ?'))return;
    update(d=>({...d,clients:(d.clients||[]).filter(c=>c.id!==id)}));
    if(selected===id)setSelected(null);
  };

  const clients=data.clients||[];
  const codOrders=data.codOrders||[];

  const filtered=clients.filter(c=>
    c.name.toLowerCase().includes(q.toLowerCase())||
    (c.phone&&c.phone.includes(q))||
    (c.city&&c.city.toLowerCase().includes(q.toLowerCase()))
  );

  // Per-client stats
  const clientStats=id=>{
    const orders=codOrders.filter(o=>o.clientId===id);
    const totalOrders=orders.length;
    const totalRevenue=orders.reduce((s,o)=>s+o.qty*o.unitPrice,0);
    const totalPaid=orders.filter(o=>o.codStatus==='Payé').reduce((s,o)=>s+o.qty*o.unitPrice+o.deliveryFee,0);
    const totalDue=orders.filter(o=>o.codStatus!=='Payé'&&o.deliveryStatus!=='Retourné'&&o.deliveryStatus!=='Annulé').reduce((s,o)=>s+o.qty*o.unitPrice+o.deliveryFee,0);
    const returned=orders.filter(o=>o.deliveryStatus==='Retourné').length;
    return{totalOrders,totalRevenue,totalPaid,totalDue,returned};
  };

  const globalStats={
    total:clients.length,
    totalRevenue:codOrders.filter(o=>o.codStatus==='Payé').reduce((s,o)=>s+o.qty*o.unitPrice,0),
    totalDue:codOrders.filter(o=>o.codStatus!=='Payé'&&o.deliveryStatus!=='Retourné'&&o.deliveryStatus!=='Annulé').reduce((s,o)=>s+o.qty*o.unitPrice+o.deliveryFee,0),
    activeThisMonth:new Set(codOrders.filter(o=>o.date.startsWith(today().slice(0,7))).map(o=>o.clientId)).size,
  };

  const selClient=selected?clients.find(c=>c.id===selected):null;
  const selOrders=selected?codOrders.filter(o=>o.clientId===selected).sort((a,b)=>b.date.localeCompare(a.date)):[];

  return(
    <div>
      {/* KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
        {[
          {label:'Total clients',val:globalStats.total,color:'#6366F1'},
          {label:'Actifs ce mois',val:globalStats.activeThisMonth,color:'#0D9488'},
          {label:'Encaissé (COD)',val:fmtMAD(globalStats.totalRevenue),color:'#10B981'},
          {label:'Créances clients',val:fmtMAD(globalStats.totalDue),color:'#EF4444'},
        ].map((k,i)=>(
          <div key={i} className="kpi-card" style={{padding:'14px 16px'}}>
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value" style={{color:k.color,fontSize:20}}>{k.val}</div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:selected?'1fr 380px':'1fr',gap:20}}>
        <div>
          <div className="section-header">
            <SearchInput value={q} onChange={setQ} placeholder="Nom, téléphone, ville..."/>
            <button className="btn btn-primary" onClick={openAdd}><Icon name="plus" size={14}/>Nouveau client</button>
          </div>
          <div className="card" style={{padding:0}}>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Client</th><th>Téléphone</th><th>Ville</th><th>Commandes</th><th>CA Total</th><th>Créance</th><th>Actions</th></tr></thead>
                <tbody>
                  {filtered.length===0&&<tr><td colSpan={7}><div className="empty-state"><div style={{fontSize:32,marginBottom:8}}>👤</div>Aucun client trouvé</div></td></tr>}
                  {filtered.map(c=>{
                    const st=clientStats(c.id);
                    const isSel=selected===c.id;
                    return(
                      <tr key={c.id} style={{background:isSel?'#F0FDFA':'',cursor:'pointer'}} onClick={()=>setSelected(isSel?null:c.id)}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:10}}>
                            <div style={{width:34,height:34,borderRadius:8,background:'#6366F1',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Outfit',fontSize:13,fontWeight:700,color:'#fff',flexShrink:0}}>
                              {c.name.split(' ').map(n=>n[0]).slice(0,2).join('')}
                            </div>
                            <div>
                              <div style={{fontWeight:600,fontSize:13}}>{c.name}</div>
                              {c.email&&<div style={{fontSize:11,color:'#94A3B8'}}>{c.email}</div>}
                            </div>
                          </div>
                        </td>
                        <td style={{fontSize:13,color:'#64748B'}}>{c.phone||'—'}</td>
                        <td style={{fontSize:13}}>{c.city||'—'}</td>
                        <td style={{textAlign:'center',fontWeight:600,color:'#6366F1'}}>{st.totalOrders}</td>
                        <td style={{fontWeight:600,color:'#0D9488'}}>{fmtMAD(st.totalRevenue)}</td>
                        <td>
                          {st.totalDue>0
                            ?<span className="badge badge-red">{fmtMAD(st.totalDue)}</span>
                            :<span className="badge badge-green">Soldé</span>}
                        </td>
                        <td onClick={e=>e.stopPropagation()}>
                          <div style={{display:'flex',gap:5}}>
                            <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(c)}><Icon name="edit" size={12}/></button>
                            <button className="btn btn-danger btn-sm" onClick={()=>del(c.id)}><Icon name="trash" size={12}/></button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        {/* Client detail panel */}
        {selClient&&(
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div className="card" style={{padding:'16px 18px'}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
                <div style={{width:48,height:48,borderRadius:12,background:'#6366F1',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Outfit',fontSize:17,fontWeight:700,color:'#fff',flexShrink:0}}>
                  {selClient.name.split(' ').map(n=>n[0]).slice(0,2).join('')}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:15}}>{selClient.name}</div>
                  <div style={{fontSize:12,color:'#64748B'}}>{selClient.city}</div>
                </div>
                <button onClick={()=>setSelected(null)} style={{background:'none',border:'none',cursor:'pointer',color:'#94A3B8',padding:4}}><Icon name="x" size={16}/></button>
              </div>
              {[
                ['Téléphone',selClient.phone],
                ['Email',selClient.email||'—'],
                ['Adresse',selClient.address||'—'],
                ['Client depuis',selClient.createdAt],
              ].map(([l,v],i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #F8FAFC',fontSize:12}}>
                  <span style={{color:'#94A3B8'}}>{l}</span><span style={{fontWeight:500,maxWidth:200,textAlign:'right'}}>{v}</span>
                </div>
              ))}
              {selClient.notes&&<div style={{marginTop:8,padding:'6px 10px',background:'#F8FAFC',borderRadius:6,fontSize:12,color:'#475569'}}>{selClient.notes}</div>}
            </div>

            {/* Client stats */}
            {(()=>{
              const st=clientStats(selClient.id);
              return(
                <div className="card" style={{padding:'14px 16px'}}>
                  <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>Résumé financier</div>
                  {[
                    ['Commandes',st.totalOrders,'#6366F1'],
                    ['CA total',fmtMAD(st.totalRevenue),'#0D9488'],
                    ['Total encaissé',fmtMAD(st.totalPaid),'#10B981'],
                    ['Créance due',fmtMAD(st.totalDue),st.totalDue>0?'#EF4444':'#10B981'],
                    ['Retours',st.returned,'#F59E0B'],
                  ].map(([l,v,c],i)=>(
                    <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #F8FAFC',fontSize:12}}>
                      <span style={{color:'#64748B'}}>{l}</span><span style={{fontWeight:700,color:c}}>{v}</span>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* Recent orders */}
            <div className="card" style={{padding:'14px 16px'}}>
              <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>Historique commandes ({selOrders.length})</div>
              {selOrders.length===0
                ?<div style={{fontSize:12,color:'#94A3B8',textAlign:'center',padding:'10px 0'}}>Aucune commande</div>
                :selOrders.slice(0,6).map(o=>{
                  const prod=data.products.find(p=>p.id===o.productId);
                  return(
                    <div key={o.id} style={{padding:'7px 0',borderBottom:'1px solid #F8FAFC',fontSize:12}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                        <span style={{fontWeight:500}}>{prod?prod.name:'—'} ×{o.qty}</span>
                        <span style={{fontWeight:600,color:'#0D9488'}}>{fmtMAD(o.qty*o.unitPrice)}</span>
                      </div>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <span style={{fontSize:11,color:'#94A3B8'}}>{o.date}</span>
                        <span className={`badge ${o.deliveryStatus==='Livré'?'badge-green':o.deliveryStatus==='Retourné'?'badge-red':'badge-yellow'}`} style={{fontSize:10,padding:'1px 6px'}}>{o.deliveryStatus}</span>
                        <span className={`badge ${o.codStatus==='Payé'?'badge-green':'badge-red'}`} style={{fontSize:10,padding:'1px 6px'}}>{o.codStatus}</span>
                      </div>
                    </div>
                  );
                })
              }
            </div>
          </div>
        )}
      </div>

      {/* Add/Edit modal */}
      <Modal title={editId?'Modifier client':'Nouveau client'} open={modal} onClose={()=>setModal(false)}>
        <div className="two-col">
          <div className="form-group"><label className="label">Nom complet *</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Prénom Nom"/></div>
          <div className="form-group"><label className="label">Téléphone</label><input className="input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+212 6xx xxx xxx"/></div>
        </div>
        <div className="two-col">
          <div className="form-group"><label className="label">Ville</label><input className="input" value={form.city} onChange={e=>setForm({...form,city:e.target.value})} placeholder="Casablanca"/></div>
          <div className="form-group"><label className="label">Email</label><input className="input" type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="client@email.com"/></div>
        </div>
        <div className="form-group"><label className="label">Adresse</label><input className="input" value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="N° Rue, Quartier"/></div>
        <div className="form-group"><label className="label">Notes</label><input className="input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="VIP, fidèle, notes..."/></div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={()=>setModal(false)}>Annuler</button>
          <button className="btn btn-primary" onClick={save}><Icon name="check" size={14}/>Enregistrer</button>
        </div>
      </Modal>
    </div>
  );
}

// ─── COD Orders Page ──────────────────────────────────────────────────────────
const COD_DELIVERY=['Préparé','Expédié','En transit','Livré','Retourné','Annulé'];
const COD_PAY=['Non payé','Payé','Partiel'];
const COD_CARRIERS=['Amana','Aramex','CTM Messagerie','Chronopost','DHL','Autre'];

function CodBadge({val,type}){
  const key=(type==='pay'?val:val).replace(/\s/g,'-');
  return<span className={`badge cod-badge-${key}`} style={{fontSize:11,padding:'2px 8px'}}>{val}</span>;
}

function CodOrders({data,update,calcs}){
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({clientId:'',productId:'',qty:1,unitPrice:'',deliveryFee:30,carrier:'',trackingNum:'',date:today(),notes:''});
  const[filterDel,setFilterDel]=useState('');
  const[filterPay,setFilterPay]=useState('');
  const[q,setQ]=useState('');
  const[selected,setSelected]=useState(null);
  const[editStatusId,setEditStatusId]=useState(null);
  const[statusForm,setStatusForm]=useState({deliveryStatus:'',codStatus:'',collectedAt:'',notes:''});

  const clients=data.clients||[];
  const codOrders=data.codOrders||[];

  const openAdd=()=>{
    setForm({clientId:'',productId:'',qty:1,unitPrice:'',deliveryFee:30,carrier:'',trackingNum:'',date:today(),notes:''});
    setModal(true);
  };

  // Auto-fill unit price when product selected
  const handleProductChange=pid=>{
    const prod=data.products.find(p=>p.id===pid);
    setForm(f=>({...f,productId:pid,unitPrice:prod?prod.sellingPrice:''}));
  };

  const save=()=>{
    if(!form.clientId||!form.productId||!form.qty||!form.unitPrice)return;
    const stock=calcs.stockMap[form.productId]||0;
    if(Number(form.qty)>stock){alert('Stock insuffisant : '+stock+' unités disponibles');return;}
    update(d=>({
      ...d,
      codOrders:[...(d.codOrders||[]),{
        id:'COD'+uid(),clientId:form.clientId,productId:form.productId,
        qty:Number(form.qty),unitPrice:Number(form.unitPrice),
        deliveryFee:Number(form.deliveryFee||0),
        carrier:form.carrier,trackingNum:form.trackingNum,
        codStatus:'Non payé',deliveryStatus:'Préparé',
        date:form.date,collectedAt:'',notes:form.notes,createdAt:today(),
      }],
      sales:[...d.sales,{
        id:'VNT'+uid(),date:form.date,productId:form.productId,
        qty:Number(form.qty),sellingPrice:Number(form.unitPrice),
        createdAt:today(),source:'cod',
      }],
    }));
    setModal(false);
  };

  const applyStatus=()=>{
    if(!editStatusId)return;
    update(d=>({
      ...d,
      codOrders:(d.codOrders||[]).map(o=>
        o.id===editStatusId
          ?{...o,
            deliveryStatus:statusForm.deliveryStatus||o.deliveryStatus,
            codStatus:statusForm.codStatus||o.codStatus,
            collectedAt:statusForm.codStatus==='Payé'&&!o.collectedAt?today():o.collectedAt,
            notes:statusForm.notes||o.notes}
          :o
      ),
    }));
    setEditStatusId(null);
  };

  const del=id=>{
    if(!confirm('Supprimer cette commande COD ?'))return;
    update(d=>({...d,codOrders:(d.codOrders||[]).filter(o=>o.id!==id)}));
  };

  // Stats
  const total=codOrders.length;
  const totalRevenue=codOrders.reduce((s,o)=>s+o.qty*o.unitPrice,0);
  const totalPaid=codOrders.filter(o=>o.codStatus==='Payé').reduce((s,o)=>s+o.qty*o.unitPrice+o.deliveryFee,0);
  const totalDue=codOrders.filter(o=>o.codStatus!=='Payé'&&o.deliveryStatus!=='Retourné'&&o.deliveryStatus!=='Annulé').reduce((s,o)=>s+o.qty*o.unitPrice+o.deliveryFee,0);
  const totalReturned=codOrders.filter(o=>o.deliveryStatus==='Retourné').length;
  const totalDelivered=codOrders.filter(o=>o.deliveryStatus==='Livré').length;

  const filtered=codOrders.filter(o=>{
    const cli=clients.find(c=>c.id===o.clientId);
    const prod=data.products.find(p=>p.id===o.productId);
    const mq=!q||(cli&&cli.name.toLowerCase().includes(q.toLowerCase()))||
      (prod&&prod.name.toLowerCase().includes(q.toLowerCase()))||
      o.id.includes(q)||(o.trackingNum&&o.trackingNum.includes(q));
    const md=!filterDel||o.deliveryStatus===filterDel;
    const mp=!filterPay||o.codStatus===filterPay;
    return mq&&md&&mp;
  }).sort((a,b)=>b.date.localeCompare(a.date));

  const selOrder=selected?codOrders.find(o=>o.id===selected):null;

  return(
    <div>
      {/* KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10,marginBottom:20}}>
        {[
          {label:'Commandes',val:total,color:'#6366F1'},
          {label:'✅ Livrées',val:totalDelivered,color:'#10B981'},
          {label:'↩ Retours',val:totalReturned,color:'#EF4444'},
          {label:'CA Total',val:fmtMAD(totalRevenue),color:'#0D9488'},
          {label:'💰 Encaissé',val:fmtMAD(totalPaid),color:'#10B981'},
          {label:'⏳ Créances',val:fmtMAD(totalDue),color:'#EF4444'},
        ].map((k,i)=>(
          <div key={i} className="kpi-card" style={{padding:'12px 14px'}}>
            <div className="kpi-label" style={{fontSize:10}}>{k.label}</div>
            <div className="kpi-value" style={{color:k.color,fontSize:18}}>{k.val}</div>
          </div>
        ))}
      </div>

      {/* Filters + actions */}
      <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <SearchInput value={q} onChange={setQ} placeholder="Client, produit, tracking..."/>
        <select className="select" value={filterDel} onChange={e=>setFilterDel(e.target.value)} style={{width:150,fontSize:13}}>
          <option value="">Livraison: Tous</option>
          {COD_DELIVERY.map(s=><option key={s}>{s}</option>)}
        </select>
        <select className="select" value={filterPay} onChange={e=>setFilterPay(e.target.value)} style={{width:140,fontSize:13}}>
          <option value="">Paiement: Tous</option>
          {COD_PAY.map(s=><option key={s}>{s}</option>)}
        </select>
        <button className="btn btn-primary" style={{marginLeft:'auto'}} onClick={openAdd}>
          <Icon name="plus" size={14}/>Nouvelle commande COD
        </button>
      </div>

      {/* Alert: unpaid + delivered */}
      {(()=>{
        const urgent=codOrders.filter(o=>o.deliveryStatus==='Livré'&&o.codStatus!=='Payé');
        if(!urgent.length)return null;
        return(
          <div className="alert alert-yellow" style={{marginBottom:14}}>
            <Icon name="alert" size={14}/>
            <strong>{urgent.length} commande(s) livrée(s) non encaissée(s)</strong> — montant : {fmtMAD(urgent.reduce((s,o)=>s+o.qty*o.unitPrice+o.deliveryFee,0))}
          </div>
        );
      })()}

      <div style={{display:'grid',gridTemplateColumns:selected?'1fr 360px':'1fr',gap:20}}>
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>N° / Date</th><th>Client</th><th>Produit</th><th>Total</th>
                  <th>Livraison</th><th>COD</th><th>Transporteur</th><th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length===0&&<tr><td colSpan={8}><div className="empty-state"><div style={{fontSize:32,marginBottom:8}}>📭</div>Aucune commande COD</div></td></tr>}
                {filtered.map(o=>{
                  const cli=clients.find(c=>c.id===o.clientId);
                  const prod=data.products.find(p=>p.id===o.productId);
                  const total=o.qty*o.unitPrice+o.deliveryFee;
                  const isSel=selected===o.id;
                  return(
                    <tr key={o.id} style={{background:isSel?'#F0FDFA':'',cursor:'pointer'}} onClick={()=>setSelected(isSel?null:o.id)}>
                      <td>
                        <div style={{fontFamily:'monospace',fontSize:11,background:'#F1F5F9',padding:'2px 5px',borderRadius:3,display:'inline-block'}}>{o.id}</div>
                        <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{o.date}</div>
                      </td>
                      <td style={{fontWeight:500,fontSize:13}}>{cli?cli.name:<span style={{color:'#94A3B8'}}>—</span>}</td>
                      <td style={{fontSize:12}}>
                        <div>{prod?prod.name:'—'}</div>
                        <div style={{color:'#94A3B8',fontSize:11}}>×{o.qty} · {fmtMAD(o.unitPrice)}/u</div>
                      </td>
                      <td style={{fontWeight:700,color:'#0D9488'}}>{fmtMAD(total)}</td>
                      <td><CodBadge val={o.deliveryStatus}/></td>
                      <td><CodBadge val={o.codStatus} type="pay"/></td>
                      <td style={{fontSize:11,color:'#64748B'}}>{o.carrier||'—'}{o.trackingNum?<div style={{fontFamily:'monospace',fontSize:10,color:'#94A3B8'}}>{o.trackingNum}</div>:null}</td>
                      <td onClick={e=>e.stopPropagation()}>
                        <div style={{display:'flex',gap:5}}>
                          <button className="btn btn-ghost btn-sm" style={{fontSize:11,color:'#0D9488',borderColor:'#99F6E4'}}
                            onClick={()=>{setStatusForm({deliveryStatus:o.deliveryStatus,codStatus:o.codStatus,collectedAt:o.collectedAt||'',notes:o.notes||''});setEditStatusId(o.id);}}>
                            Statut
                          </button>
                          <button className="btn btn-danger btn-sm" style={{padding:'4px 8px'}} onClick={()=>del(o.id)}><Icon name="trash" size={12}/></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* Order detail panel */}
        {selOrder&&(()=>{
          const cli=clients.find(c=>c.id===selOrder.clientId);
          const prod=data.products.find(p=>p.id===selOrder.productId);
          return(
            <div className="card" style={{padding:'16px 18px',height:'fit-content'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:14}}>Détail commande</div>
                <button onClick={()=>setSelected(null)} style={{background:'none',border:'none',cursor:'pointer',color:'#94A3B8',padding:4}}><Icon name="x" size={16}/></button>
              </div>
              <div style={{background:'#F8FAFC',borderRadius:8,padding:'10px 12px',marginBottom:12}}>
                <div style={{fontWeight:600,fontSize:13}}>{cli?cli.name:'—'}</div>
                <div style={{fontSize:12,color:'#64748B'}}>{cli?cli.phone:''}</div>
                {cli&&cli.address&&<div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{cli.address}, {cli.city}</div>}
              </div>
              {[
                ['Produit',prod?prod.name:'—'],
                ['Quantité',selOrder.qty],
                ['Prix unitaire',fmtMAD(selOrder.unitPrice)],
                ['Frais livraison',fmtMAD(selOrder.deliveryFee)],
                ['Total COD',<strong style={{color:'#0D9488',fontSize:15}}>{fmtMAD(selOrder.qty*selOrder.unitPrice+selOrder.deliveryFee)}</strong>],
                ['Statut livraison',<CodBadge val={selOrder.deliveryStatus}/>],
                ['Statut paiement',<CodBadge val={selOrder.codStatus} type="pay"/>],
                ['Transporteur',selOrder.carrier||'—'],
                ['N° Tracking',selOrder.trackingNum?<span style={{fontFamily:'monospace',fontSize:11}}>{selOrder.trackingNum}</span>:'—'],
                ['Date commande',selOrder.date],
                ['Date encaissement',selOrder.collectedAt||'—'],
              ].map(([l,v],i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #F8FAFC',fontSize:12}}>
                  <span style={{color:'#94A3B8'}}>{l}</span><span style={{fontWeight:500,textAlign:'right'}}>{v}</span>
                </div>
              ))}
              {selOrder.notes&&<div style={{marginTop:8,padding:'6px 8px',background:'#FFFBEB',borderRadius:6,fontSize:11,color:'#92400E'}}>{selOrder.notes}</div>}
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:12}}
                onClick={()=>{setStatusForm({deliveryStatus:selOrder.deliveryStatus,codStatus:selOrder.codStatus,collectedAt:selOrder.collectedAt||'',notes:selOrder.notes||''});setEditStatusId(selOrder.id);}}>
                Mettre à jour le statut
              </button>
            </div>
          );
        })()}
      </div>

      {/* New COD order modal */}
      <Modal title="Nouvelle commande COD" open={modal} onClose={()=>setModal(false)}>
        <div className="form-group">
          <label className="label">Client *</label>
          <select className="select" value={form.clientId} onChange={e=>setForm({...form,clientId:e.target.value})}>
            <option value="">Sélectionner un client...</option>
            {clients.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
          </select>
          {!clients.length&&<div style={{fontSize:11,color:'#EF4444',marginTop:4}}>Aucun client — ajoutez-en d'abord dans la page Clients</div>}
        </div>
        <div className="form-group">
          <label className="label">Produit *</label>
          <select className="select" value={form.productId} onChange={e=>handleProductChange(e.target.value)}>
            <option value="">Sélectionner un produit...</option>
            {data.products.map(p=>{
              const stock=calcs.stockMap[p.id]||0;
              return<option key={p.id} value={p.id} disabled={stock<=0}>{p.name} — Stock: {stock}</option>;
            })}
          </select>
        </div>
        <div className="two-col">
          <div className="form-group"><label className="label">Quantité *</label><input className="input" type="number" min="1" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})}/></div>
          <div className="form-group"><label className="label">Prix unitaire (MAD) *</label><input className="input" type="number" value={form.unitPrice} onChange={e=>setForm({...form,unitPrice:e.target.value})} placeholder="Auto depuis produit"/></div>
        </div>
        <div className="two-col">
          <div className="form-group"><label className="label">Frais livraison (MAD)</label><input className="input" type="number" value={form.deliveryFee} onChange={e=>setForm({...form,deliveryFee:e.target.value})}/></div>
          <div className="form-group"><label className="label">Date</label><input className="input" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
        </div>
        <div className="two-col">
          <div className="form-group"><label className="label">Transporteur</label>
            <select className="select" value={form.carrier} onChange={e=>setForm({...form,carrier:e.target.value})}>
              <option value="">— Choisir —</option>
              {COD_CARRIERS.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="label">N° Tracking</label><input className="input" value={form.trackingNum} onChange={e=>setForm({...form,trackingNum:e.target.value})} placeholder="Ex: AM123..."/></div>
        </div>
        {form.productId&&form.qty&&form.unitPrice&&(
          <div style={{background:'#F0FDFA',border:'1px solid #99F6E4',borderRadius:8,padding:'10px 14px',marginBottom:10,fontSize:13}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <span style={{color:'#64748B'}}>Montant COD à encaisser</span>
              <strong style={{color:'#0D9488',fontSize:15}}>{fmtMAD(Number(form.qty)*Number(form.unitPrice)+Number(form.deliveryFee||0))}</strong>
            </div>
          </div>
        )}
        <div className="form-group"><label className="label">Notes</label><input className="input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Instructions spéciales..."/></div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick={()=>setModal(false)}>Annuler</button>
          <button className="btn btn-primary" onClick={save}><Icon name="check" size={14}/>Créer la commande</button>
        </div>
      </Modal>

      {/* Status update modal */}
      <Modal title="Mettre à jour le statut" open={!!editStatusId} onClose={()=>setEditStatusId(null)}>
        {editStatusId&&(()=>{
          const o=codOrders.find(x=>x.id===editStatusId);
          const cli=o?clients.find(c=>c.id===o.clientId):null;
          const prod=o?data.products.find(p=>p.id===o.productId):null;
          return(
            <div>
              <div style={{background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:13}}>
                <strong>{cli?cli.name:'—'}</strong> — {prod?prod.name:'—'}<br/>
                <span style={{color:'#0D9488',fontWeight:600}}>{o?fmtMAD(o.qty*o.unitPrice+o.deliveryFee):'—'}</span>
              </div>
              <div className="form-group">
                <label className="label">Statut livraison</label>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
                  {COD_DELIVERY.map(s=>(
                    <button key={s} type="button" onClick={()=>setStatusForm({...statusForm,deliveryStatus:s})}
                      style={{padding:'8px 4px',borderRadius:7,border:`2px solid ${statusForm.deliveryStatus===s?'#6366F1':'#E2E8F0'}`,
                        background:statusForm.deliveryStatus===s?'#EEF2FF':'#fff',cursor:'pointer',fontSize:11,fontWeight:600,
                        color:statusForm.deliveryStatus===s?'#4F46E5':'#64748B',transition:'all 0.12s'}}>
                      {s}
                    </button>
                  ))}
                </div>
              </div>
              <div className="form-group">
                <label className="label">Statut paiement COD</label>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
                  {COD_PAY.map(s=>(
                    <button key={s} type="button" onClick={()=>setStatusForm({...statusForm,codStatus:s})}
                      style={{padding:'8px 4px',borderRadius:7,border:`2px solid ${statusForm.codStatus===s?'#10B981':'#E2E8F0'}`,
                        background:statusForm.codStatus===s?'#F0FDF4':'#fff',cursor:'pointer',fontSize:11,fontWeight:600,
                        color:statusForm.codStatus===s?'#059669':'#64748B',transition:'all 0.12s'}}>
                      {s}
                    </button>
                  ))}
                </div>
              </div>
              <div className="form-group"><label className="label">Note</label><input className="input" value={statusForm.notes} onChange={e=>setStatusForm({...statusForm,notes:e.target.value})} placeholder="Ex: Livré en mains propres, client absent..."/></div>
              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button className="btn btn-ghost" onClick={()=>setEditStatusId(null)}>Annuler</button>
                <button className="btn btn-primary" onClick={applyStatus}><Icon name="check" size={14}/>Confirmer</button>
              </div>
            </div>
          );
        })()}
      </Modal>
    </div>
  );
}

// ─── Global Search ────────────────────────────────────────────────────────────
function GlobalSearch({data,setPage}){
  const[q,setQ]=useState('');
  const[open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const results=useMemo(()=>{
    if(!q||q.length<2)return[];
    const ql=q.toLowerCase();
    const out=[];
    data.products.forEach(p=>{
      if(p.name.toLowerCase().includes(ql)||p.category.toLowerCase().includes(ql))
        out.push({type:'Produit',tc:'#DBEAFE',tt:'#1D4ED8',label:p.name,sub:p.category+' · '+fmtMAD(p.sellingPrice),page:'products'});
    });
    data.suppliers.forEach(s=>{
      if(s.name.toLowerCase().includes(ql)||s.city.toLowerCase().includes(ql))
        out.push({type:'Fournisseur',tc:'#DCFCE7',tt:'#15803D',label:s.name,sub:s.city+' · '+s.phone,page:'suppliers'});
    });
    (data.employees||[]).forEach(e=>{
      if(e.name.toLowerCase().includes(ql)||e.cin.toLowerCase().includes(ql)||e.role.toLowerCase().includes(ql))
        out.push({type:'Employ\u00e9',tc:'#EDE9FE',tt:'#6D28D9',label:e.name,sub:e.role+' · CIN: '+e.cin,page:'employees'});
    });
    data.purchases.forEach(a=>{
      const pr=data.products.find(p=>p.id===a.productId);
      if(pr&&pr.name.toLowerCase().includes(ql))
        out.push({type:'Achat',tc:'#FEF9C3',tt:'#854D0E',label:pr.name,sub:a.date+' · Qt\u00e9 '+a.qty,page:'purchases'});
    });
    data.sales.forEach(v=>{
      const pr=data.products.find(p=>p.id===v.productId);
      if(pr&&pr.name.toLowerCase().includes(ql))
        out.push({type:'Vente',tc:'#CCFBF1',tt:'#0F766E',label:pr.name,sub:v.date+' · '+fmtMAD(v.qty*v.sellingPrice),page:'sales'});
    });
    return out.slice(0,10);
  },[q,data]);
  return(
    <div className="global-search-wrap" ref={ref} style={{width:240}}>
      <div style={{position:'relative'}}>
        <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#94A3B8',pointerEvents:'none'}}>
          <Icon name="search" size={14}/>
        </span>
        <input className="input" value={q}
          onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          placeholder="Recherche globale..."
          style={{paddingLeft:32,fontSize:13,height:36}}
        />
        {q&&<button onClick={()=>{setQ('');setOpen(false);}} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'#94A3B8',padding:2}}>
          <Icon name="x" size={13}/>
        </button>}
      </div>
      {open&&results.length>0&&(
        <div className="global-search-results">
          {results.map((r,i)=>(
            <div key={i} className="gs-item" onClick={()=>{setPage(r.page);setQ('');setOpen(false);}}>
              <span className="gs-type" style={{background:r.tc,color:r.tt}}>{r.type}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.label}</div>
                <div style={{fontSize:11,color:'#94A3B8'}}>{r.sub}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      {open&&q.length>=2&&results.length===0&&(
        <div className="global-search-results">
          <div style={{padding:'16px',textAlign:'center',color:'#94A3B8',fontSize:13}}>Aucun r\u00e9sultat pour "{q}"</div>
        </div>
      )}
    </div>
  );
}

// ─── Notifications Bell ───────────────────────────────────────────────────────
function NotifBell({data,calcs,setPage}){
  const[open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const notifs=useMemo(()=>{
    const list=[];
    data.products.forEach(p=>{
      const stock=calcs.stockMap[p.id]||0;
      if(stock<=0) list.push({type:'danger',icon:'alert',title:'Rupture de stock',body:p.name,page:'stock'});
      else if(stock<=5) list.push({type:'warning',icon:'alert',title:'Stock faible ('+stock+')',body:p.name,page:'stock'});
    });
    data.suppliers.forEach(s=>{
      const debt=calcs.supplierDebt[s.id]||0;
      if(debt>10000) list.push({type:'warning',icon:'users',title:'Dette \u00e9lev\u00e9e: '+fmtMAD(debt),body:s.name,page:'suppliers'});
    });
    const curMonth=new Date().toISOString().slice(0,7);
    (data.employees||[]).filter(e=>e.status==='Actif').forEach(e=>{
      const paid=(data.salaryPayments||[]).some(s=>s.employeeId===e.id&&s.month===curMonth);
      if(!paid) list.push({type:'info',icon:'briefcase',title:'Salaire non pay\u00e9 ('+curMonth+')',body:e.name,page:'employees'});
    });
    return list;
  },[data,calcs]);
  const BG={danger:'#FEE2E2',warning:'#FEF9C3',info:'#DBEAFE'};
  const FG={danger:'#991B1B',warning:'#854D0E',info:'#1D4ED8'};
  return(
    <div style={{position:'relative'}} ref={ref}>
      <button onClick={()=>setOpen(!open)} style={{background:'none',border:'1px solid #E2E8F0',borderRadius:8,padding:'6px 10px',cursor:'pointer',color:'#64748B',display:'flex',alignItems:'center',gap:6,position:'relative'}}>
        <Icon name="bell" size={15}/>
        {notifs.length>0&&<span style={{position:'absolute',top:3,right:3,width:8,height:8,borderRadius:'50%',background:'#EF4444',border:'2px solid #fff'}}/>}
        <span style={{fontSize:12,fontWeight:500}}>{notifs.length}</span>
      </button>
      {open&&(
        <div className="notif-panel">
          <div style={{padding:'12px 16px',borderBottom:'1px solid #F1F5F9',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontWeight:600,fontSize:13}}>Alertes ({notifs.length})</span>
            <button onClick={()=>setOpen(false)} style={{background:'none',border:'none',cursor:'pointer',color:'#94A3B8'}}>
              <Icon name="x" size={14}/>
            </button>
          </div>
          {notifs.length===0
            ? <div style={{padding:'20px',textAlign:'center',color:'#94A3B8',fontSize:13}}>Tout est en ordre ✓</div>
            : notifs.map((n,i)=>(
                <div key={i} className="notif-item" style={{cursor:'pointer'}} onClick={()=>{setPage(n.page);setOpen(false);}}>
                  <div style={{width:30,height:30,borderRadius:7,background:BG[n.type],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:FG[n.type]}}>
                    <Icon name={n.icon} size={14}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,color:FG[n.type]}}>{n.title}</div>
                    <div style={{fontSize:11,color:'#94A3B8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.body}</div>
                  </div>
                </div>
              ))
          }
        </div>
      )}
    </div>
  );
}

// ─── Backup & Restore ─────────────────────────────────────────────────────────
function BackupRestore({data}){
  const[open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const exportData=()=>{
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='tradeflow_backup_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(url);
    setOpen(false);
  };
  const importData=()=>{
    const input=document.createElement('input');
    input.type='file';
    input.accept='.json';
    input.onchange=e=>{
      const file=e.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const parsed=JSON.parse(ev.target.result);
          if(!parsed.products||!parsed.suppliers)throw new Error('Format invalide');
          if(confirm('Importer ces donn\u00e9es? Cela remplacera toutes vos donn\u00e9es actuelles.')){
            localStorage.setItem('tradeflow_maroc_v1',JSON.stringify(parsed));
            window.location.reload();
          }
        }catch(err){
          alert('Fichier invalide: '+err.message);
        }
      };
      reader.readAsText(file);
    };
    input.click();
    setOpen(false);
  };
  return(
    <div style={{position:'relative'}} ref={ref}>
      <button onClick={()=>setOpen(!open)} style={{background:'none',border:'1px solid #E2E8F0',borderRadius:8,padding:'6px 10px',cursor:'pointer',color:'#64748B',display:'flex',alignItems:'center',gap:6}}>
        <Icon name="database" size={15}/>
        <span style={{fontSize:12,fontWeight:500}}>Donn\u00e9es</span>
      </button>
      {open&&(
        <div style={{position:'absolute',top:42,right:0,background:'#fff',border:'1px solid #E2E8F0',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,0.1)',zIndex:300,width:190,overflow:'hidden'}}>
          <div style={{padding:'6px 0'}}>
            <button onClick={exportData} style={{width:'100%',padding:'10px 16px',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:10,fontSize:13,color:'#1E293B',textAlign:'left'}}>
              <Icon name="download" size={15}/>
              <div>
                <div style={{fontWeight:500}}>Exporter</div>
                <div style={{fontSize:11,color:'#94A3B8'}}>Sauvegarder en JSON</div>
              </div>
            </button>
            <button onClick={importData} style={{width:'100%',padding:'10px 16px',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:10,fontSize:13,color:'#1E293B',textAlign:'left'}}>
              <Icon name="upload" size={15}/>
              <div>
                <div style={{fontWeight:500}}>Importer</div>
                <div style={{fontSize:11,color:'#94A3B8'}}>Restaurer un backup</div>
              </div>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Monthly Report ───────────────────────────────────────────────────────────
function MonthlyReport({data,calcs,onClose}){
  const[month,setMonth]=useState(new Date().toISOString().slice(0,7));
  const mSales=data.sales.filter(v=>v.date.startsWith(month));
  const mPurchases=data.purchases.filter(a=>a.date.startsWith(month));
  const mSalaries=(data.salaryPayments||[]).filter(s=>s.month===month);
  const tSales=mSales.reduce((s,v)=>s+v.qty*v.sellingPrice,0);
  const tPurchases=mPurchases.reduce((s,a)=>s+a.qty*a.unitPriceFranc*a.exchangeRate,0);
  const tSalaries=mSalaries.reduce((s,p)=>s+p.total,0);
  const tProfit=mSales.reduce((s,v)=>s+(v.sellingPrice-(calcs.avgCostMap[v.productId]||0))*v.qty,0);
  const netResult=tProfit-tSalaries;
  const lowStock=data.products.filter(p=>(calcs.stockMap[p.id]||0)<=5);
  const monthLabel=new Date(month+'-02').toLocaleDateString('fr-MA',{month:'long',year:'numeric'});
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'#fff',borderRadius:16,width:'100%',maxWidth:680,maxHeight:'90vh',overflowY:'auto',boxShadow:'0 25px 50px rgba(0,0,0,0.2)'}}>
        <div style={{padding:'18px 24px',background:'#0F172A',borderRadius:'16px 16px 0 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontFamily:'Outfit',fontSize:17,fontWeight:700,color:'#fff'}}>Rapport Mensuel</div>
            <div style={{fontSize:11,color:'#64748B',marginTop:2}}>TradeFlow Maroc — {new Date().toLocaleDateString('fr-MA')}</div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input type="month" value={month} onChange={e=>setMonth(e.target.value)}
              style={{padding:'5px 10px',border:'1px solid #334155',borderRadius:6,background:'#1E293B',color:'#fff',fontSize:12}}/>
            <button onClick={()=>window.print()} className="btn btn-ghost" style={{color:'#94A3B8',borderColor:'#334155',fontSize:12}}>
              <Icon name="printer" size={14}/>Imprimer
            </button>
            <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'#64748B',padding:4}}>
              <Icon name="x" size={18}/>
            </button>
          </div>
        </div>
        <div style={{padding:'22px 24px'}}>
          <div style={{textAlign:'center',marginBottom:18,padding:'10px',background:'#F8FAFC',borderRadius:8}}>
            <div style={{fontFamily:'Outfit',fontSize:19,fontWeight:700,color:'#0F172A',textTransform:'capitalize'}}>{monthLabel}</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
            {[
              {label:"Chiffre d\u0027affaires",val:tSales,color:'#0D9488',bg:'#CCFBF1'},
              {label:'B\u00e9n\u00e9fice brut',val:tProfit,color:'#10B981',bg:'#DCFCE7'},
              {label:'Total achats',val:tPurchases,color:'#3B82F6',bg:'#DBEAFE'},
              {label:'Masse salariale',val:tSalaries,color:'#EF4444',bg:'#FEE2E2'},
            ].map((k,i)=>(
              <div key={i} style={{background:k.bg,borderRadius:10,padding:'12px 16px'}}>
                <div style={{fontSize:11,color:k.color,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px'}}>{k.label}</div>
                <div style={{fontFamily:'Outfit',fontSize:22,fontWeight:700,color:k.color,marginTop:4}}>{fmtMAD(k.val)}</div>
              </div>
            ))}
          </div>
          <div style={{background:netResult>=0?'#F0FDF4':'#FEF2F2',border:'1px solid '+(netResult>=0?'#BBF7D0':'#FECACA'),borderRadius:10,padding:'12px 16px',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontWeight:600,fontSize:13}}>R\u00e9sultat net (b\u00e9n\u00e9fice \u2212 salaires)</span>
            <span style={{fontFamily:'Outfit',fontSize:22,fontWeight:700,color:netResult>=0?'#15803D':'#B91C1C'}}>{fmtMAD(netResult)}</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
            <div>
              <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>Ventes ({mSales.length})</div>
              {mSales.length===0
                ? <div style={{fontSize:12,color:'#94A3B8'}}>Aucune vente ce mois</div>
                : mSales.map(v=>{
                    const p=data.products.find(pr=>pr.id===v.productId);
                    return(
                      <div key={v.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'4px 0',borderBottom:'1px solid #F1F5F9'}}>
                        <span style={{color:'#475569'}}>{p?p.name:'—'} \xd7{v.qty}</span>
                        <span style={{fontWeight:500,color:'#0D9488'}}>{fmtMAD(v.qty*v.sellingPrice)}</span>
                      </div>
                    );
                  })
              }
            </div>
            <div>
              <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>Achats ({mPurchases.length})</div>
              {mPurchases.length===0
                ? <div style={{fontSize:12,color:'#94A3B8'}}>Aucun achat ce mois</div>
                : mPurchases.map(a=>{
                    const p=data.products.find(pr=>pr.id===a.productId);
                    return(
                      <div key={a.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'4px 0',borderBottom:'1px solid #F1F5F9'}}>
                        <span style={{color:'#475569'}}>{p?p.name:'—'} \xd7{a.qty}</span>
                        <span style={{fontWeight:500,color:'#3B82F6'}}>{fmtMAD(a.qty*a.unitPriceFranc*a.exchangeRate)}</span>
                      </div>
                    );
                  })
              }
            </div>
          </div>
          {mSalaries.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>Salaires pay\u00e9s</div>
              {mSalaries.map(s=>{
                const e=data.employees&&data.employees.find(em=>em.id===s.employeeId);
                return(
                  <div key={s.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'4px 0',borderBottom:'1px solid #F1F5F9'}}>
                    <span style={{color:'#475569'}}>{e?e.name:'—'}{e?' \u2014 '+e.role:''}</span>
                    <span style={{fontWeight:500,color:'#EF4444'}}>{fmtMAD(s.total)}</span>
                  </div>
                );
              })}
            </div>
          )}
          {lowStock.length>0&&(
            <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:'12px 14px'}}>
              <div style={{fontWeight:600,fontSize:13,marginBottom:6,color:'#92400E'}}>&#9888; Alertes stock ({lowStock.length})</div>
              {lowStock.map(p=>(
                <div key={p.id} style={{fontSize:12,color:'#92400E',padding:'2px 0'}}>
                  {p.name} \u2014 {calcs.stockMap[p.id]||0} unit\u00e9(s)
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────
function App(){
  const{data,update}=useStore();
  const[page,setPage]=useState('dashboard');
  const[sidebarOpen,setSidebarOpen]=useState(false);
  const[showReport,setShowReport]=useState(false);
  const calcs=useCalcs(data);
  const login=()=>update(d=>({...d,auth:{loggedIn:true}}));
  const logout=()=>update(d=>({...d,auth:{loggedIn:false}}));
  if(!data.auth.loggedIn)return<LoginPage onLogin={login}/>;
  const meta=PAGE_META[page]||{title:page,sub:''};
  return(
    <div>
      {sidebarOpen&&<div onClick={()=>setSidebarOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:99}}/>}
      <Sidebar page={page} setPage={p=>{setPage(p);setSidebarOpen(false);}} onLogout={logout} open={sidebarOpen}/>
      <div className="main">
        <div className="topbar">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <button onClick={()=>setSidebarOpen(!sidebarOpen)} style={{display:'none',background:'none',border:'none',cursor:'pointer',padding:4}} className="menu-btn">
              <Icon name="menu" size={20}/>
            </button>
            <div>
              <div className="page-title">{meta.title}</div>
              <div style={{fontSize:12,color:'#94A3B8',marginTop:1}}>{meta.sub}</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <GlobalSearch data={data} setPage={setPage}/>
            <NotifBell data={data} calcs={calcs} setPage={setPage}/>
            <button onClick={()=>setShowReport(true)} style={{background:'none',border:'1px solid #E2E8F0',borderRadius:8,padding:'6px 10px',cursor:'pointer',color:'#64748B',display:'flex',alignItems:'center',gap:6,fontSize:12,fontWeight:500}}>
              <Icon name="file" size={15}/>Rapport
            </button>
            <BackupRestore data={data}/>
            <span style={{fontSize:11,color:'#94A3B8',paddingLeft:6,borderLeft:'1px solid #E2E8F0'}}>
              {new Date().toLocaleDateString('fr-MA',{day:'numeric',month:'short',year:'numeric'})}
            </span>
          </div>
        </div>
        <div className="content">
          {page==='dashboard'&&<Dashboard data={data} calcs={calcs}/>}
          {page==='products'&&<Products data={data} update={update} calcs={calcs}/>}
          {page==='suppliers'&&<Suppliers data={data} update={update} calcs={calcs}/>}
          {page==='purchases'&&<Purchases data={data} update={update} calcs={calcs}/>}
          {page==='sales'&&<Sales data={data} update={update} calcs={calcs}/>}
          {page==='stock'&&<Stock data={data} calcs={calcs}/>}
          {page==='finance'&&<Finance data={data} calcs={calcs}/>}
          {page==='employees'&&<Employees data={data} update={update} calcs={calcs}/>}
          {page==='wholesale'&&<Wholesale data={data} update={update} calcs={calcs}/>}
          {page==='logistics'&&<Logistics data={data} update={update} calcs={calcs}/>}
          {page==='clients'&&<Clients data={data} update={update} calcs={calcs}/>}
          {page==='cod'&&<CodOrders data={data} update={update} calcs={calcs}/>}
          {page==='admin'&&<Admin data={data} update={update} calcs={calcs}/>}
        </div>
      </div>
      {showReport&&<MonthlyReport data={data} calcs={calcs} onClose={()=>setShowReport(false)}/>}
      <style>{`@media(max-width:768px){.menu-btn{display:flex!important;}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
